<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Opciones de inicio de sesión en Solercia Command</title>
  <desc id="desc">Dos caminos que terminan en la misma sesión: correo y contraseña con POST /auth/login, o SSO con Keycloak por OIDC con state, nonce y PKCE, validación del ID token contra el JWKS y vínculo por emisor y sujeto o por correo verificado.</desc>
  <defs>
    <style>
      text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
      .bg{fill:#f8fafc;stroke:#e2e8f0}
      .h{fill:#0f172a;font-size:22px;font-weight:700}
      .sub{fill:#475569;font-size:13px}
      .t{fill:#0f172a;font-size:14px;font-weight:600}
      .s{fill:#475569;font-size:12px}
      .k{fill:#64748b;font-size:11px;font-weight:700;letter-spacing:.08em}
      .c{fill:#334155;font-size:11.5px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
      .ind{fill:#eef2ff;stroke:#6366f1;stroke-width:1.5}
      .grn{fill:#ecfdf5;stroke:#10b981;stroke-width:1.5}
      .ln{fill:none;stroke:#64748b;stroke-width:1.6}
      .ah{fill:#64748b}
      @media (prefers-color-scheme:dark){
        .bg{fill:#0d1117;stroke:#30363d}
        .h,.t{fill:#e6edf3}
        .sub,.s{fill:#9da7b3}
        .k{fill:#8b949e}
        .c{fill:#c9d1d9}
        .box{fill:#161b22;stroke:#30363d}
        .ind{fill:#1c1f3a;stroke:#818cf8}
        .grn{fill:#0f2a20;stroke:#34d399}
        .ln{stroke:#8b949e}
        .ah{fill:#8b949e}
      }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="959" height="499" rx="16"/>
  <text class="h" x="32" y="44">Dos formas de entrar, una sola sesión</text>
  <text class="sub" x="32" y="66">El SSO es opcional y termina en la misma cookie de refresco que el ingreso local.</text>

  <!-- Lane A -->
  <text class="k" x="32" y="96">CORREO Y CONTRASEÑA</text>
  <rect class="box" x="32" y="106" width="220" height="70" rx="10"/>
  <text class="t" x="48" y="134">Pantalla de ingreso</text>
  <text class="s" x="48" y="155">correo y contraseña</text>
  <rect class="box" x="284" y="106" width="220" height="70" rx="10"/>
  <text class="c" x="300" y="134">POST /auth/login</text>
  <text class="s" x="300" y="155">verifica la clave con bcrypt</text>
  <rect class="box" x="536" y="106" width="208" height="70" rx="10"/>
  <text class="t" x="552" y="134">Emite los tokens</text>
  <text class="s" x="552" y="155">acceso 30 min · refresco 7 días</text>
  <path class="ln" d="M252 141 H282" marker-end="url(#a)"/>
  <path class="ln" d="M504 141 H534" marker-end="url(#a)"/>
  <path class="ln" d="M744 141 H774" marker-end="url(#a)"/>

  <!-- Lane B -->
  <text class="k" x="32" y="244">SSO CON KEYCLOAK (OIDC)</text>
  <rect class="ind" x="32" y="254" width="220" height="70" rx="10"/>
  <text class="t" x="48" y="282">Ingresar con SSO</text>
  <text class="s" x="48" y="303">botón en la pantalla de ingreso</text>
  <rect class="ind" x="284" y="254" width="220" height="70" rx="10"/>
  <text class="c" x="300" y="282">/auth/sso/keycloak/login</text>
  <text class="s" x="300" y="303">state, nonce y PKCE en Redis</text>
  <rect class="ind" x="536" y="254" width="208" height="70" rx="10"/>
  <text class="t" x="552" y="282">Keycloak autentica</text>
  <text class="s" x="552" y="303">en la página del proveedor</text>
  <path class="ln" d="M252 289 H282" marker-end="url(#a)"/>
  <path class="ln" d="M504 289 H534" marker-end="url(#a)"/>
  <path class="ln" d="M640 324 V339 H142 V352" marker-end="url(#a)"/>

  <rect class="ind" x="32" y="354" width="220" height="70" rx="10"/>
  <text class="c" x="48" y="382">/sso/keycloak/callback</text>
  <text class="s" x="48" y="403">ID token validado con el JWKS</text>
  <rect class="ind" x="284" y="354" width="220" height="70" rx="10"/>
  <text class="t" x="300" y="382">Resuelve la persona</text>
  <text class="s" x="300" y="403">(issuer, subject) o correo verificado</text>
  <rect class="ind" x="536" y="354" width="208" height="70" rx="10"/>
  <text class="t" x="552" y="382">Cookie de refresco</text>
  <text class="s" x="552" y="403">vuelve al front en /auth/callback</text>
  <path class="ln" d="M252 389 H282" marker-end="url(#a)"/>
  <path class="ln" d="M504 389 H534" marker-end="url(#a)"/>
  <path class="ln" d="M744 389 H774" marker-end="url(#a)"/>

  <!-- Session -->
  <rect class="grn" x="776" y="106" width="152" height="318" rx="12"/>
  <text class="t" x="852" y="232" text-anchor="middle">Sesión activa</text>
  <text class="s" x="852" y="256" text-anchor="middle">cookie httpOnly</text>
  <text class="s" x="852" y="274" text-anchor="middle">de refresco</text>
  <text class="c" x="852" y="300" text-anchor="middle">POST /auth/refresh</text>
  <text class="s" x="852" y="318" text-anchor="middle">renueva el acceso</text>
  <text class="s" x="852" y="344" text-anchor="middle">menús según el rol</text>

  <text class="s" x="32" y="458">Se activa con SSO_ENABLED=true y las cuatro variables OIDC_KEYCLOAK_*. Una cuenta desconocida solo se crea</text>
  <text class="s" x="32" y="476">con SSO_AUTO_PROVISION=true (apagado por defecto); en otro caso el ingreso responde 403.</text>
</svg>
