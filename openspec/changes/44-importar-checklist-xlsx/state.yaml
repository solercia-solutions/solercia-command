  - "R13 (design, CORREGIDO 2026-08-26) Un down_revision que apunte a una revisión inexistente rompe alembic upgrade head EN DESPLIEGUE, no en revisión. Era el caso del esquema con 0026 reservado al 40: el 44 habría escrito 0027 con down_revision='0026' sin que nadie hubiera escrito 0026 — Alta — D-REV: numeración SIN RESERVAS (0026 con down_revision='0025' y 0027 con down_revision='0026') más gate de alembic heads en vivo como primera unidad de la rebanada A, con corrección de la mención del delta de boards en el mismo commit si la cabeza real no es 0025"
  - "R14 (design) La exploración §3.3 afirmaba que el JOIN a BoardColumn ya estaba en la CTE del roll-up; no lo está para la columna de la tarea, y board_column_id es nulable — Media — D-CTE: outerjoin nuevo y aliasado más coalesce(..., false) para que una tarea sin columna no salga del denominador"
  - "R15 (design) completed_at histórico en --update-existing: una tarea importada abierta que cierra en una corrida posterior recibiría now() en vez de la fecha de «CERRADA el YYYY-MM-DD» — Media — D-UPD: no se sobrescribe y se emite advertencia con el ID y las dos fechas. Es de segundo orden porque el runbook parte de una base sin tareas"
  - "R16 (design) El sembrado de PANDORA solo es alcanzable por purge_demo_data.py --execute, que exige pg_dump verificado — Baja — documentado como paso 2 del despliegue. Descartado un --bootstrap-only que crearía un segundo camino hacia run_maintenance con garantías distintas"
  - "R17 (design) Semillas obsoletas: CONSOLIDATION_DEFAULTS referencia IDs concretos y la hoja es un documento vivo — Baja — D-SEEDS: las semillas son advisorias; un ID ausente produce advertencia, nunca error, con prueba de apoyo dedicada"
  - "R18 (pasada correctiva, H1) --dry-run deja de correr en una máquina sin base de datos: antes prometía ser offline — Media — aceptado y documentado en la tabla de la CLI y en el runbook. Es el precio de un informe verdadero: sin base no se puede distinguir «crear» de «ya existe», y ese informe es lo que el usuario usa para decidir la consolidación"
  - "R19 (pasada correctiva, H4) Una etiqueta añadida A MANO en la aplicación podría perderse al reconciliar con --update-existing — Media — unassign_label solo actúa sobre las derivadas (area:*, apoyo-ia:*, recurrente, pspi:*); cualquier otro nombre es intocable y cada retiro se enumera en el reporte con ID y nombre"
  - "R20 (pasada correctiva, H5) Una Label borrada lógicamente bloquea la creación por uq_labels_project_name, que es TOTAL, y el IntegrityError abortaría la corrida entera dentro de la frontera de D-TX — Media — D-LBL-IO: ensure_label busca sin filtro de estado y reactiva antes de crear, con prueba de apoyo dedicada"
  - "R21 (pasada correctiva, H8) Correos institucionales filtrados al historial de git si se codificaran en seeds.py, en importer.py o en una prueba — Alta — D-USERS: llegan por --member repetible, las pruebas usan correos ficticios y un nombre sin correo mapeado termina con salida 1 sin escribir nada"
  - "R22 (pasada correctiva, H20) alembic downgrade -1 NO revierte la rebanada A una vez aplicada la B: deshace la última revisión, que sería 0027 — Baja — la reversa de A es -1 solo mientras B no esté aplicada, y -2 después; queda escrito en la tabla de rebanadas y en el paso 1 del despliegue"
