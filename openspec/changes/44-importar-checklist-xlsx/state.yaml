last_updated: 2026-08-26
proposal_notes:
  - "Propuesta escrita en openspec/changes/44-importar-checklist-xlsx/proposal.md siguiendo la profundidad de 43/proposal.md (convención del proyecto), por encima del presupuesto genérico de 450 palabras del skill sdd-propose"
  - "Las nueve decisiones del orquestador (exploración §8) se adoptaron ÍNTEGRAS como D1-D9, más las técnicas de §3 como D-MIG, D-DDL, D-CSV, D-CSV-DEF, D-LBL, D-PSPI, D-REC, D-CNT, D-DESC y D-BADGE. open_questions queda vacío"
  - "DIVERGENCIA DECLARADA respecto al encargo: se añade dashboard-executive como CUARTA capacidad modificada. El encargo enumeró tres (project-hierarchy, boards, tasks), pero D3 cambia el comportamiento observable de GET /dashboard/executive y su requisito R3 (dashboard-executive/spec.md:24) está publicado. O se incluye el delta MODIFIED de R3, o D3 se implementa sin requisito que lo respalde. El orquestador puede revertirlo quitándolo de capabilities.modified y de target_capabilities"
  - "DERIVACIÓN DECLARADA respecto a la decisión 8 del orquestador: DOS migraciones (0026 en A, 0027 en B) en vez de una. Tras la corrección del 2026-08-26 no hay números reservados: 0026 es la primera libre tras el 0025 del 43. Partirla en dos es consecuencia de que A y B son PR encadenados con reversa independiente, y una migración compartida rompería alembic downgrade -1 como reversa de A"
  - "El delta de project-hierarchy DEBE ser MODIFIED sobre el requisito «Avance consolidado por conteo de tareas (roll-up)» (spec.md:113) y reescribir el escenario «Tareas cancelled excluidas del denominador» (:121-125) sobre la bandera. Nunca ADDED: el requisito ya está publicado y sdd-archive lo duplicaría"
  - "La capacidad nueva checklist-import cubre: contrato de la CLI y sus dos modos, mapeo de las 7 formas de Estado y de Urgencia, las 3 formas de Fecha Límite, ruteo a SEGURIDAD/PANDORA, composición de la descripción, etiquetado en dos niveles, formato y validación del CSV de consolidación, creación de usuarios sin credenciales, idempotencia por ancla, semántica de --update-existing y el informe de salida"
spec_notes:
  - "5 archivos escritos en openspec/changes/44-importar-checklist-xlsx/specs/: checklist-import/spec.md (capacidad NUEVA, 29 requisitos/74 escenarios, formato plano ## Requirements sin envoltorio ADDED/MODIFIED, siguiendo el precedente de org-role-templates/spec.md para capacidades recién creadas — NO el formato de delta de 43/42, que aplica solo quando la capacidad base ya existe publicada), project-hierarchy/spec.md (MODIFIED, 1 requisito/5 escenarios), boards/spec.md (ADDED, 4 requisitos/12 escenarios), tasks/spec.md (ADDED, 4 requisitos/12 escenarios), dashboard-executive/spec.md (MODIFIED, 1 requisito/3 escenarios). Total 39 requisitos, 106 escenarios, contados en disco por rg '^### Requirement:' / '^#### Scenario:'"
  - "DECISIÓN DE SPEC (a validar por el orquestador): el delta MODIFIED de project-hierarchy excluye del denominador del roll-up TANTO las columnas excluded_from_progress=true COMO las tareas con context_group IS NOT NULL. El boundary de la propuesta (línea 59 de este archivo) solo describe la bandera de columna para el CTE de rollup_progress; la exclusión de context_group fue asignada explícitamente por el orquestador a dashboard-executive (D3, module_decision). Esta extensión a project-hierarchy no está en el boundary/module_decision de la propuesta y se aplicó por instrucción directa del orquestador en el encargo de sdd-spec, no por reapertura autónoma de una decisión ya tomada; queda documentada aquí para que el orquestador la confirme o la revierta antes de sdd-design"
  - "Migraciones referenciadas con su down_revision exacto en los deltas: 0026 (down_revision=0025, boards.excluded_from_progress) y 0027 (down_revision=0026, tasks.context_group + tasks.merge_into_task_id), consistentes con D-MIG y con la cabeza de Alembic verificada en la exploración (0024 en disco, 0025 del 43). SIN RESERVAS: el 40 toma el siguiente consecutivo libre en su propio apply"
  - "Nota para sdd-archive añadida en el delta de project-hierarchy: la bala de 'Limitaciones y deuda conocida' sobre el estado cancelled (spec.md:195) queda obsoleta con este cambio y debe eliminarse o reemplazarse al fusionar, siguiendo el mismo patrón de nota que usó el delta de api-conventions del cambio 42"
  - "checklist-import NO declara modelo propio de persistencia: consume explícitamente las columnas ADDED de tasks y boards de este mismo cambio, documentado en su sección ## Alcance"
  - "PASADA CORRECTIVA 2026-08-26 sobre los deltas (conteos en disco antes -> después): dashboard-executive 1 requisito/3 escenarios -> 2/5, porque H7 añade el MODIFIED de R1 («La agrupación por persona excluye tareas de contexto») con dos escenarios; el requisito R3 se precisa en texto (totals.tasks excluye contexto; totals.overdue y totals.at_risk NO, y totals.at_risk debe ser igual a len(at_risk)) sin cambiar sus tres escenarios. checklist-import se edita SIN cambiar conteos (29/74): el paréntesis de códigos de salida en :527 se alinea con D-EXIT y suma --member a la lista de banderas; la frase de transacción única en :559 pasa a «ningún commit de un repositorio DEBE cerrar la transacción externa del importador (join_transaction_mode=create_savepoint)» y precisa que --dry-run ejecuta las escrituras dentro de la transacción; y el requisito de usuarios incorpora --member, la prohibición de codificar correos y la salida 1 para un nombre sin correo mapeado. boards (4/12), tasks (4/12) y project-hierarchy (1/5) NO se tocan. TOTAL 39/106 -> 40/108"
design_notes:
  - "Diseño escrito en openspec/changes/44-importar-checklist-xlsx/design.md siguiendo la profundidad y la estructura de 43/design.md (convención del proyecto), por encima del presupuesto genérico de 800 palabras del skill sdd-design"
  - "TRECE decisiones técnicas nuevas, todas cerradas aquí y ninguna reabriendo D1-D9 ni las técnicas de la propuesta: D-TX (transacción única sobre un commit preexistente del repositorio), D-REV (gate de cabeza de Alembic en vivo), D-SEED (el sembrado de PANDORA vive en bootstrap.py, no en el importador), D-CTE (outerjoin nuevo, coalesce y secuenciación A->B), D-CTE-MIG (migración de datos: ninguna), D-COL (sin índice en las dos columnas nuevas), D-ERR (jerarquía de errores propia), D-CFG (límites antibomba propios), D-CSVIO (utf-8-sig), D-SEEDS (semillas advisorias), D-INTENT (cuatro dataclasses congeladas), D-PASS (orden de escritura y enlaces directos) y D-BADGE-UI (componente compartido + checklist ux-psicologia)"
  - "COBERTURA COMPLETA: 106 de 106 escenarios mapeados a una prueba nombrada, con tipo RED o guardia y con archivo y rebanada. Guardias: 63, 73, 74, 75, 78, 79, 95, 101. Sin prueba automatizada quedan solo los dos de frontend (102, 103), cerrados con `npm run build` más la revisión ux-psicologia, por la misma razón que el 43 documentó en su D-H (no hay runner de pruebas y tsconfig.app.json solo compila lo alcanzable desde main.ts)"
  - "TRES pruebas de APOYO sin escenario propio, exigidas por el diseño: test_completed_at_override_is_absent_from_taskcreate_and_the_router (C), test_seed_ids_absent_from_the_sheet_produce_a_warning_not_an_error (E) y test_cross_project_links_are_rejected_before_any_write (E)"
  - "DIVERGENCIA DECLARADA respecto al encargo: se añade un UNDÉCIMO archivo de prueba, test_tasks_context_fields.py, a los diez enumerados. Motivo: precedente del 43 — los archivos test_migration_* alojan solo pruebas de migración (síncronas, asyncio.run, base desechable) y las de API viven aparte (asyncio con loop_scope='session' y cliente in-process); mezclarlas obligaría a dos estilos de fixture en el mismo módulo"
