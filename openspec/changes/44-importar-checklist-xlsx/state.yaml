boundary:
  - "Migración 0026 (rebanada A, down_revision='0025'): board_columns.excluded_from_progress BOOLEAN NOT NULL DEFAULT false, espejada en el modelo. Se marcan Removida y Gestionada aparte en SEGURIDAD y en PANDORA"
  - "CTE de rollup_progress (projects/repository.py:290-350): el denominador deja de excluir el literal Task.status != 'cancelled' (repository.py:330, usado en :335 y :337) y pasa a excluir las tareas asignadas a columnas con excluded_from_progress. El JOIN a BoardColumn ya existe por el DISTINCT ON (board.project_id) de :309-328"
  - "Tablero de PANDORA a 7 columnas vía MaintenanceRepository.ensure_board_columns (repository.py:392-419, status_key VERBATIM) en este orden exacto: Backlog, Doing, Diferida, Recurrente, Gestionada aparte, Removida, Done. Done obligatoriamente última. Invariante nueva que congela columnas y orden, porque _i4_seguridad_columns solo protege a SEGURIDAD"
  - "Migración 0027 (rebanada B, down_revision='0026'): tasks.context_group VARCHAR(80) NULL y tasks.merge_into_task_id UUID NULL con auto-FK ondelete='SET NULL' con la misma forma que parent_task_id (tasks/models.py:72-76), espejadas en __table_args__"
  - "context_group expresa DOS cosas con una columna: NOT NULL significa «es contexto» y el valor es el nombre del grupo. Descartada la etiqueta contexto:<grupo>: no es consultable como exclusión en la CTE sin un JOIN adicional a task_labels"
  - "Exposición de solo lectura: TaskRead.context_group y TaskRead.merge_into_task_id. TaskCreate y TaskUpdate NO se tocan"
  - "DashboardService (CORREGIDO por H7): _build_by_assignee, _build_workload y el conteo tasks de _build_totals excluyen context_group IS NOT NULL — by_assignee y workload cuentan lo mismo y no pueden discrepar. _build_at_risk NO excluye (una tarea de contexto vencida sigue siendo riesgo real), y los contadores de riesgo totals.overdue/totals.at_risk tampoco: totals.at_risk debe ser SIEMPRE igual a len(at_risk)"
  - "Insignia de procedencia (diferida por el 43, D6): insignia de solo lectura junto al task_key en el frontend, visible solo con external_key no nulo, con aria-label del sistema de origen"
  - "TaskService.create_task(..., *, actor_id=None, external_origin=None, completed_at_override: datetime | None = None). Keyword-only, ausente de TaskCreate y del router. Se aplica SOLO cuando el estado resuelto es el de cierre; en cualquier otro caso se ignora"
  - "Paquete nuevo backend/app/importers/checklist/: parser.py (mecánica del XLSX, sin BD), mapping.py (funciones puras fila -> intención), consolidation.py (escritura, lectura y validación del CSV), importer.py (caso de uso dueño de la transacción al estilo maintenance/runner.py:19-61) y report.py"
  - "CLI backend/scripts/import_checklist.py calcada de purge_demo_data.py: --file, --dry-run (por defecto, EXIGE conexión a BD), --csv-out (por defecto checklist_consolidation.csv), --execute --csv-in <ruta>, --update-existing, --member \"Nombre=correo\" REPETIBLE, --database-url, códigos de salida 0/1/2/3/4 según D-EXIT, redact_database_url y engine propio con dispose()"
  - "La fila fusionada SE CREA con su ancla external_key, en la columna Removida del proyecto destino, con merge_into_task_id apuntando a la superviviente y descripción «Consolidada en SEG-N (T-xx)». Queda fuera del avance por el mismo mecanismo que cualquier Removida"
  - "Validación del CSV antes de escribir nada: toda fila decidida (action no vacía), toda referencia merge_into:/subtask_of: apunta a un ID presente en el XLSX, y sin ciclos en el grafo de subtareas. Dos pasadas: crear todas las tareas, luego enlazar padres, porque create_task exige que el padre exista y esté en el mismo proyecto (service.py:282-290)"
  - "Usuarios sin acceso: User(hashed_password=None, is_active=True) + OrganizationMember(role=MemberRole.viewer). Cero esquema nuevo. Los CORREOS llegan por --member (D-USERS) y jamás se codifican en el repositorio"
  - "Etiquetas en dos niveles: area:<primer segmento normalizado> (27 valores) + apoyo-ia:{total,parcial,no} + recurrente + pspi:x.y. La Categoría completa va a la descripción como línea «**Categoría:** …», nunca a una etiqueta. El importador necesita su propio ensure_label: LabelService.create_label NO es get-or-create (labels/service.py:47 lanza 422 duplicate_label_name); assign_label SÍ es idempotente (:120-122)"
  - "Fuera de alcance: tablas de vínculos de plan del 45, Microsoft Planner, ingesta de correo (47), convertir el is_context transitorio en columna, cambios en TaskCreate/TaskUpdate, cambiar la metodología de PANDORA, castellanizar los rótulos de PANDORA y cualquier conteo esperado de filas"
module_decision:
  - "D1 (orquestador) UN SOLO CAMBIO con siete rebanadas encadenadas A -> G; NO se parte en dos cambios. El ciclo verify/archive se hace una sola vez, las costuras A/B/C se verifican contra la base real dentro de la misma cadena y el usuario ve su checklist real al cerrar el 44. Alternativa descartada: 44 (costuras A/B/C) + 46 (importador D/E/F/G), que daba dos cadenas de 3-4 rebanadas a costa de un número de cambio nuevo y una dependencia más en el grafo"
  - "D2 (orquestador) Diferida y Recurrente PERMANECEN en el denominador de avance; solo Removida y Gestionada aparte se marcan excluded_from_progress (más merge_into_task_id no nulo, que vive en Removida por construcción). Es literalmente lo que el 42 comprometió en data-maintenance/spec.md:142, y la bandera por columna deja la puerta abierta a cambiar de opinión SIN migración"
  - "D3 (orquestador, AMPLIADA por H7) El dashboard ejecutivo EXCLUYE context_group en _build_by_assignee, _build_workload y el conteo tasks de _build_totals; NO en _build_at_risk ni en totals.overdue/totals.at_risk, que espejan esa lista. El texto original decía solo workload y totals: dejaba by_assignee contando tareas de contexto como trabajo en curso mientras workload no las contaba como carga, es decir dos bloques de la misma pantalla discrepando sobre la misma persona. CONSECUENCIA DE ARTEFACTOS: el delta MODIFIED de dashboard-executive crece de 1 requisito/3 escenarios a 2/5 (se añade R1). Texto original de D3: El dashboard ejecutivo EXCLUYE context_group en _build_workload y _build_totals; NO en _build_at_risk. Una tarea de contexto vencida sigue siendo un riesgo real que el jefe debe ver, pero no debe contar como carga de nadie. CONSECUENCIA DE ARTEFACTOS: cambia el comportamiento observable de GET /dashboard/executive, cuyo requisito R3 (dashboard-executive/spec.md:24) está publicado, así que exige un delta MODIFIED. Es la cuarta capacidad modificada, añadida a las tres que enumeró el encargo"
  - "D4 (orquestador) Opción B para PANDORA: ampliar el board a 7 columnas vía ensure_board_columns, con Done obligatoriamente última, más una invariante propia. Sin migración y sin cambiar de metodología (_i3_hierarchy_shape sigue verde), status_key verbatim igual que SEGURIDAD, BoardAwareStrategy.allowed_statuses() (methodology/board_aware.py:39-51) devuelve los status_key PERSISTIDOS y allowed_statuses()[-1] sigue siendo el estado de cierre. Descartada A (colapsar a 3 columnas + etiqueta estado-origen:*): las 3 REMOVIDA de PANDORA caerían en Backlog e inflarían carga, riesgo y denominador. Descartada C (PANDORA a custom): rompe _i3_hierarchy_shape (invariants.py:29-33) y obliga a tocar una spec ARCHIVADA"
  - "D5 (orquestador) tasks.context_group VARCHAR(80) NULL y tasks.merge_into_task_id UUID NULL, con la fila fusionada CREADA y no omitida. Omitirla es un fallo de idempotencia: sin fila, la siguiente corrida ve get_by_external_key('checklist_xlsx','T-81') -> None y querrá crearla, y la decisión viviría solo en el CSV. Nombre merge_into_task_id y no merge_into, por convención con parent_task_id. task_dependencies descartada: es una arista «blocks», otra semántica (task_links/models.py:1-12,23-38)"
  - "D6 (orquestador) board_columns.excluded_from_progress como bandera, no literales Removida/Gestionada aparte junto a cancelled en repository.py:330. La bandera es agnóstica de metodología y de tenant, el JOIN a BoardColumn ya está en la CTE, y cancelled deja de ser un literal muerto. La alternativa de 3 líneas metería el vocabulario de UN tenant en el SQL genérico de roll-up: empeora el problema de H3 en vez de arreglarlo"
  - "D7 (orquestador) Usuarios sin login: User con hashed_password=None, is_active=True y OrganizationMember(role=viewer). CERO esquema nuevo: users/models.py:65 ya declara hashed_password nulable con el comentario normativo :59-64 (un usuario creado o vinculado SOLO vía SSO nunca obtiene contraseña local) y auth/service.py:27 rechaza hashed_password is None con el MISMO resultado genérico que una contraseña errónea. is_active=False descartado: aunque is_org_member no lo mira (tasks/repository.py:318-329), los desaparecería de list_org_members y de la vista ejecutiva, que es justo donde deben verse como responsables"
  - "D8 (orquestador) completed_at_override keyword-only, aplicado SOLO cuando el estado resuelto es el de cierre. Réplica exacta del patrón que el 43 estableció para external_origin. Necesario porque completed_at NO es escribible por ningún camino: no está en TaskCreate (schemas.py:13-43) ni en TaskUpdate (:62-82), se deriva en _resolve_completed_at (service.py:854-864) y create_task lo invoca con current=None (service.py:328), así que una tarea creada en la columna de cierre recibe datetime.now(UTC). Descartados: UPDATE posterior (abre una ventana con la fila ya visible con completed_at = now()) y añadirlo a TaskUpdate (rompería D-INM del 43 y expondría el campo por API)"
  - "D9 (orquestador) Paquete propio backend/app/importers/checklist/. Screaming Architecture: maintenance significa hoy «purga y bootstrap de la instalación» y su spec data-maintenance está ARCHIVADA; un importador de datos de negocio no es eso. El paquete nuevo tiene capacidad OpenSpec propia (checklist-import) y puede importar MaintenanceRepository.ensure_board_columns sin heredar el alcance de la purga. Coste aceptado: un paquete de primer nivel más"
  - "D-MIG (derivada de D8 del orquestador, CORREGIDA 2026-08-26) DOS migraciones y no una: 0026 en la rebanada A (board_columns.excluded_from_progress, down_revision='0025') y 0027 en la rebanada B (tasks.context_group + tasks.merge_into_task_id, down_revision='0026'). SIN NÚMEROS RESERVADOS: 0025 es del 43, 0026 es la primera libre tras él, y el cambio 40 tomará el siguiente consecutivo libre en el momento de su propio apply. Partirla en dos es consecuencia de la entrega encadenada, porque A y B son PR con reversa independiente y una sola migración compartida rompería alembic downgrade -1 como reversa de A"
  - "D-DDL Los objetos de esquema espejados en __table_args__ y protegidos con prueba de EQUIVALENCIA DE DDL entre Base.metadata.create_all y alembic upgrade head, no con alembic check. El harness construye el esquema con create_all (tests/conftest.py:74-80) y el 43 verificó sobre alembic==1.14.0 que el gate no compara postgresql_where ni CheckConstraint: el riesgo real es un falso NEGATIVO silencioso"
  - "D-CSV --execute EXIGE --csv-in: sin el CSV no hay decisiones y el importador no debe adivinarlas. Por defecto --execute SOLO crea lo que falta; la actualización de tareas ya importadas se habilita con --update-existing y se limita a una lista blanca explícita (status, priority, due_date, completed_at, etiquetas). Motivo: una vez importadas esas tareas se editan en la aplicación, y un --execute que sobrescriba en silencio destruiría el trabajo del usuario, que es exactamente el fallo del que protege este cambio"
  - "D-CSV-DEF Los valores por defecto del CSV son los VEREDICTOS VERIFICADOS de la exploración §1, no las propuestas originales: fusiones confirmadas (T-81->T-05, T-114->T-130) como merge_into:; T-113 ya REMOVIDA en la fuente, no se fusiona otra vez; T-23 como subtask_of:T-77 (no es fusión, es dependencia); T-76->T-35 como import con nota «la fuente lo deja abierto»; T-78 independiente con nota (colgarlo de un padre COMPLETADA escondería el pendiente y rompería _subtask_progress); subtareas T-129->T-111 y T-127->T-126 confirmadas; el bloque PSPI como tareas reales, con T-94 y T-99 marcadas consolidaciones y T-82/T-92 con nota de cobertura parcial; grupos de contexto corregidos (añadir T-07, T-107, T-122, T-71, T-54; NO incluir T-74); T-95 en el conteo; contradicciones (T-38/T-124, T-34/T-35, T-62 contenedor de 5 entregables, T-72 regla de comportamiento) como notas; T-40/T-41 SIN nota de contradicción (es titularidad, no estados incompatibles)"
  - "D-LBL Etiquetas en dos niveles: area:<primer segmento normalizado> (27 valores: area:seguridad, area:pandora, area:mipg, area:dlp, area:vulnerabilidades…) como etiqueta principal filtrable, más apoyo-ia:{total,parcial,no}, recurrente y pspi:x.y. Una etiqueta por Categoría completa daría 72 nombres que, al ser uq_labels_project_name (por proyecto), se duplican en SEGURIDAD y PANDORA: ~150 filas de labels para 135 tareas y un desplegable de filtro inservible. El primer segmento DEBE normalizarse: la fuente trae inconsistencias de caja (Seguridad / Datos Personales vs DLP / Datos personales) y variantes (Transparencia / ITA vs Cumplimiento / Transparencia (ITA))"
  - "D-PSPI Etiqueta pspi:x.y sobre las 25 filas del plan (prefijo [PSPI x.y] en F83..F107) y sobre las operativas que el CSV declare vinculadas. Es lo único con numeración explotable en la fuente: NO existe numeración de PAI en el archivo, así que pai:12.1 no es derivable de aquí. El control ISO ya viaja en el Detalle y NO se convierte en etiqueta (duplicaría 25 valores más de un vocabulario que ya crece). Deja al 45 una migración trivial de etiqueta a relación"
  - "D-REC La etiqueta recurrente se deriva de una REGLA EXPLÍCITA, nunca del cruce ingenuo Estado x Fecha Límite: los dos conjuntos no coinciden (T-25 es DIFERIDA con fecha literal 'Recurrente' y T-39 es RECURRENTE con fecha ISO 2026-06-22). Además T-72 es un recordatorio permanente con Estado PENDIENTE y fecha ISO, que ninguna regla automática captura: entra como nota del CSV"
  - "D-CNT Ningún conteo esperado de filas en el código ni en las pruebas. La hoja es un documento vivo: hoy declara A1:K136 (135 filas de datos, T-01..T-135) y el análisis previo del orquestador correspondía a una versión de 131 que ni siquiera incluía T-132..T-135, dos de ellas CRÍTICAS. El número de filas es un dato de entrada, nunca una constante"
  - "D-DESC Descripción compuesta (Solicitante + Fecha límite + Detalle + Observaciones) mayor a 4000 caracteres: FALLO en esa fila nombrando su ID, nunca truncar en silencio. TaskCreate.description declara max_length=4000"
  - "D-BADGE La insignia de procedencia diferida por el 43 (D6) se entrega en la rebanada B: insignia de SOLO LECTURA junto al task_key, visible únicamente con external_key no nulo, con aria-label del sistema de origen. Revisión ux-psicologia OBLIGATORIA antes de cerrar B. El 43 la difirió porque tras él no existía ni una sola tarea anclada; en B ya existen columnas y contrato, así que por fin es verificable"
  - "D-TX (design) La transacción única del importador se construye ligando la sesión a una conexión con join_transaction_mode='create_savepoint' sobre una transacción externa, NO pidiéndole a TaskRepository que deje de comitear. TaskRepository.create COMITEA (tasks/repository.py:229-235) y save también (:237-242): con la sesión ordinaria, la primera tarea creada quedaría comiteada de forma irreversible y el requisito «un fallo a mitad revierte todo» sería imposible. Cada session.commit() interno libera y reabre un SAVEPOINT; la transacción externa se cierra en UN punto, con la semántica de runner.py:48-51. Patrón ya probado en tests/conftest.py:88-110. Descartados: quitar el commit del repositorio (cambio transversal a todo el módulo tasks, fuera de alcance), escribir con un repositorio propio (viola el contrato del 43) y compensar tras un commit parcial (el requisito pide rollback, no compensación). CAMINO ÚNICO DE --dry-run (H1): --dry-run NO se detiene en el CSV. Recorre parsear -> mapear -> aplicar semillas -> escribir el CSV -> EJECUTAR importer.py con esas decisiones sembradas DENTRO de la transacción -> rollback(), y su reporte muestra los conteos que se habrían escrito, medidos contra la base real. Consecuencia normativa: --dry-run EXIGE conexión a base de datos (queda en la tabla de la CLI y en el runbook; sin ella, salida 1). Un --dry-run offline no puede distinguir crear de ya existe y sus conteos serían ficción, que es justo el fallo del que protege el cambio"
  - "D-REV (design, CORREGIDA 2026-08-26) Numeración SIN RESERVAS. El esquema anterior reservaba 0026 al cambio 40 (planificado, sin apply en esta ola) y fijaba 0027 con down_revision='0026': eso rompe alembic upgrade head EN DESPLIEGUE con «Can't locate revision identified by '0026'» porque Alembic encadena por down_revision. Cadena definitiva: 43->0025, 44->0026 (board_columns, down_revision='0025') + 0027 (tasks, down_revision='0026'), 45a->0028 (down_revision='0027'); el 40 toma el siguiente consecutivo libre en el momento de su propio apply. La primera unidad de la rebanada A sigue siendo un GATE, y son DOS comprobaciones distintas (H14): alembic heads lee el DIRECTORIO backend/alembic/versions/ (qué revisiones existen como archivo) y alembic current lee la BASE objetivo (qué revisión tiene aplicada alembic_version); ambos deben devolver 0025 antes de escribir 0026, más el conteo de migraciones reclamadas por los cambios pendientes. Confundirlos es el error que el gate impide: heads puede decir 0025 con la base en 0024. Si la cabeza real no es 0025, se re-anclan número y padre y el mismo commit corrige LOS TRES deltas afectados: boards (cita 0026 en :5, :20, :21, :26), tasks (cita 0026 y 0027 en :4, :25, :26, :31, :32) y project-hierarchy (no cita números, pero su denominador depende de la bandera que entrega esa migración, así que su nota de dependencia se revisa en el mismo commit). H13: NO se cita el encabezado del 0025 («Head verified live...»), porque ese archivo todavía NO existe en disco — el 43 está en apply: pending y el gate D-REV es justamente lo que lo verifica en vivo"
  - "D-SEED (design) El sembrado de las 7 columnas de PANDORA y el marcado de banderas viven en maintenance/bootstrap.py (PANDORA_COLUMNS junto a SEGURIDAD_COLUMNS + MaintenanceRepository.mark_columns_excluded_from_progress), y la invariante nueva _i9_pandora_columns entra en collect_invariants. El importador NO siembra columnas y NO lleva --ensure-boards. Motivo decisivo: la spec de boards exige que el fallo de la invariante se reporte con código distinto de cero «en el script de mantenimiento que la evalúa» (purge_demo_data.py vía run_maintenance); con el sembrado fuera de bootstrap, run_maintenance quedaría ROJO en I9 en toda máquina donde el importador no haya corrido, y EXIT_INVARIANT_FAILED pasaría a ser el estado normal del 42. Descartados también: dos caminos de sembrado (dos fuentes de literales para el mismo board) y una invariante fuera de collect_invariants (no bloquea el commit del runner). Las banderas se prueban sin invariante propia: collect_invariants no crece sin requisito de spec"
  - "D-CTE (design) CORRIGE un supuesto de la exploración §3.3: el JOIN a BoardColumn que ya existe en rollup_progress (projects/repository.py:309-328) une BoardColumn a Board dentro de la subconsulta last_status con DISTINCT ON (board.project_id) y solo expone la ÚLTIMA status_key del tablero; la bandera de la columna DE CADA TAREA exige un outerjoin NUEVO y aliasado sobre BoardColumn.id == Task.board_column_id. Además board_column_id es NULLABLE (tasks/models.py:83-88): con outerjoin, not_(excluded_from_progress) sería NULL y expulsaría del denominador a toda tarea sin columna, así que el predicado usa coalesce(..., false). Secuenciación A->B: A entrega solo el término de la bandera y B añade el término de contexto a la MISMA expresión; ninguna prueba de A puede fijar la forma del SQL ni la lista de términos, todas afirman conteos done/total. H15: in_denominator sustituye a not_cancelled en LOS DOS términos, no solo en el denominador — el literal está DEFINIDO en :330 (la :329 está en blanco; la subconsulta last_status cierra en :328) y se consume en :335 (total) y :337 (done). Filtrar solo total dejaría que una tarea en Removida que además fuera el último status_key sumara en el numerador, y un proyecto podría reportar done > total"
  - "D-CTE-MIG (design) Migración de datos: NINGUNA. excluded_from_progress nace NOT NULL DEFAULT false, así que toda fila existente entra correcta al upgrade; el estado final (Removida y Gestionada aparte en true) lo fija el sembrado idempotente, no un UPDATE dentro de 0026. Un UPDATE ... WHERE status_key IN ('Removida','Gestionada aparte') marcaría esas columnas en TODA organización de cualquier despliegue futuro, incluidas las que usen esos rótulos con otro significado, y sería irreversible en el downgrade. La bandera es configuración de tenant, no forma del esquema"
  - "D-COL (design) Ni context_group ni merge_into_task_id llevan índice, total ni parcial. context_group se consulta siempre como IS NULL dentro de una consulta ya acotada por Project.id IN (subtree); un índice parcial WHERE context_group IS NOT NULL sirve a la selección contraria y ninguna consulta la hace. La exclusión del dashboard ni siquiera llega al motor (itera en Python una lista ya cargada por list_for_org, dashboard/service.py:79). merge_into_task_id solo se lee por id de la fila que lo contiene. Misma regla que el 43 aplicó para no indexar source por separado"
  - "D-ERR (design) Jerarquía de errores propia en app/importers/checklist/errors.py: ChecklistImportError (code + row_id) con ChecklistFileError, ChecklistSheetError, ChecklistHeaderError, ChecklistTooLargeError, ChecklistRowError y ChecklistConsolidationError. NO hereda de AppException (su status_code es un dato falso en una CLI) y NO reutiliza jira/errors.py (acoplaría un importador de negocio al vocabulario de un conector). ChecklistRowError SIEMPRE transporta el ID de la fila: es lo que hace exigibles D-DESC y los mensajes de validación del CSV"
  - "D-CFG (design) Ajustes antibomba PROPIOS en app/config.py: CHECKLIST_FILE_MAX_ROWS=10_000 y CHECKLIST_FILE_MAX_CELLS=200_000, junto a los JIRA_FILE_MAX_* (config.py:249-250) pero independientes. Reutilizar los de Jira ataría el techo de este importador a la afinación de un conector ajeno: subir JIRA_FILE_MAX_ROWS movería en silencio la guarda de un proceso que escribe en producción. La guarda se evalúa DENTRO del bucle de iter_rows, molde _guard_limits (jira/file_parser.py:70-76)"
  - "D-CSVIO (design) El CSV se escribe con encoding='utf-8-sig' (BOM) y newline='', y se lee con el mismo utf-8-sig, que descarta el BOM si está y no estorba si no. Delimitador ',' (el de csv por defecto); csv.writer entrecomilla lo que lo necesita. Motivo: el CSV existe para que el usuario lo abra en Excel; sin BOM, Excel en Windows lo interpreta en la página de códigos local y destruye tildes y ñ de los 27 valores de area: y de las notas. Precedente en el repositorio: jira/file_parser.py:87. Descartado el delimitador ';' (dependiente de la configuración regional y ajeno al csv estándar con el que se relee). H9 — LECTURA TOLERANTE CON TECHO EXPLÍCITO, en este orden exacto: (1) utf-8-sig, el caso normal; (2) ante UnicodeDecodeError, UN solo reintento con cp1252 (la página de códigos de Excel en Windows en español) más una ADVERTENCIA en el reporte que nombra la codificación usada; (3) si cp1252 tampoco decodifica, ChecklistConsolidationError tipado con SALIDA 2 nombrando la codificación intentada y la posición del byte que falló. NUNCA se decodifica con errors='replace': una ñ convertida en ? dentro de una nota de consolidación es una decisión del usuario corrompida en silencio. NOTA DE CONFIGURACIÓN REGIONAL para el runbook: en es-CO Excel suele usar ';' como separador de lista, así que un Guardar como CSV puede devolver un archivo que el csv estándar lee como UNA sola columna; el runbook indica guardar como «CSV UTF-8 (delimitado por comas)» y abrirlo con Datos -> Desde texto/CSV eligiendo coma y UTF-8, no con doble clic. La validación detecta el caso (una fila con menos de siete columnas es CSV inválido, salida 2) y el mensaje lo dice con esas palabras"
  - "D-SEEDS (design) Los veredictos verificados de la exploración §1 viven como DATOS versionados e inmutables en backend/app/importers/checklist/seeds.py (SeedDecision frozen con action + note; CONSOLIDATION_DEFAULTS), nunca como if en consolidation.py. Son ADVISORIOS: se aplica la semilla del ID presente en el XLSX, y una semilla cuyo ID no aparece en la hoja produce ADVERTENCIA en el reporte, nunca error — la hoja es un documento vivo y una semilla obsoleta no puede tumbar un --dry-run. No viola D-CNT: D-CNT prohíbe conteos esperados de FILAS, no referencias a filas concretas, y CONSOLIDATION_DEFAULTS no contiene un solo número de filas. Nomenclatura: el encargo pedía seeds/consolidation_defaults.py; hay exactamente una tabla, así que se entrega como el módulo seeds.py y pasa a paquete si aparece una segunda. H10 — cómo se prueban sin el archivo real: las pruebas K de los escenarios 41-45 construyen con openpyxl en tmp_path un XLSX SINTÉTICO que incluye los IDs que el escenario necesita (T-23, T-74, T-81, el rango T-82..T-106 del bloque PSPI y T-38/T-124/T-34/T-35/T-62/T-72 de las contradicciones) con títulos, detalles y observaciones FICTICIOS: el ID es lo único que importa para la aserción. Ese fixture es la única excepción al 6-10 filas del escenario 74, que gobierna el fixture de INTEGRACIÓN, y no viola D-CNT porque ninguna prueba afirma cuántas filas tiene. Además, las note de CONSOLIDATION_DEFAULTS NO reproducen texto institucional literal: son redacciones propias y cortas del criterio, nunca una cita de la celda Observaciones, porque seeds.py sí entra al repositorio y es la puerta por la que el texto de la entidad se colaría al historial de git"
  - "D-INTENT (design) Cuatro dataclasses CONGELADAS marcan las fronteras: ChecklistRow (parser, lo que el archivo dice verbatim), RowIntent (mapping, lo que se pretende escribir, puro sin BD), Decision (consolidation, lo que el usuario decidió) y PlannedWrite (importer, operación resuelta: create/update/skip/link_parent/link_merge). Congeladas para que una etapa posterior no pueda mutar la conclusión de una anterior, y porque son la única forma de probar D y E sin base de datos y sin @skip_no_db. H19: RowIntent.due_date y RowIntent.completed_at son datetime TZ-AWARE en UTC, nunca ingenuos. openpyxl con data_only=True devuelve datetime sin tzinfo y el texto ISO de la hoja tampoco trae zona; mapping.py es el único punto de normalización (.replace(tzinfo=UTC) sobre la fecha civil declarada, inicio del día) y una prueba pura lo afirma para las dos formas de celda (escenario 6). Un ingenuo produce TypeError contra el datetime.now(UTC) del dashboard (dashboard/service.py:76) y un completed_at histórico que se lee como UTC sin serlo. No se inventa conversión desde America/Bogota: la fuente nunca la expresó"
  - "D-PASS (design) Orden dentro de la única transacción: ensure_users -> resolver SEG/PAN -> pasada 1 (get_by_external_key y, si None, create_task con external_origin y completed_at_override; las merge_into: se crean con status='Removida') -> pasada 2 (enlaces parent_task_id y merge_into_task_id) -> etiquetas -> informe -> commit solo si execute y sin error. La pasada 2 escribe el atributo DIRECTAMENTE sobre la entidad ORM porque TaskUpdate NO declara parent_task_id (schemas.py:62-82) y create_task exige que el padre ya exista en el mismo proyecto (service.py:282-290); asigna también task_type='subtask', replicando el resultado de _resolve_child_type para un padre que no es épica (el importador nunca crea épicas ni asigna estimation_points, así que las otras dos reglas son vacuas). Descartado ordenar topológicamente y crear en una sola pasada: es viable (el grafo es acíclico por la validación de E) pero contradice el requisito «Enlace de subtareas en dos pasadas», que es texto de spec. Los enlaces merge_into:/subtask_of: NO pueden cruzar SEGURIDAD y PANDORA: se rechazan en la validación de E, ANTES de escribir, con la función pura de ruteo de mapping.py (no hace falta BD para saber a qué proyecto va una fila). H11 — LOS CINCO ATRIBUTOS de la pasada 2, enumerados para que ninguno quede implícito: parent_task_id (de subtask_of:), task_type='subtask' (derivado del anterior, replicando _resolve_child_type en service.py:345-366 para un padre que no es épica), merge_into_task_id (de merge_into:), context_group (de context_group:<nombre>, porque TaskCreate/TaskUpdate no lo declaran) y la nota «Consolidada en SEG-N (T-xx)» en description — esta última SOLO puede escribirse aquí porque SEG-N, el task_key de la superviviente, no existe hasta después de la pasada 1, y CUENTA para el límite de 4000 de D-DESC: la longitud verificada es descripción compuesta + nota, medida antes de escribir, y si excede falla con su ID (salida 4) sin truncar. REGLA DE NO-OP en reejecución: cada uno se compara antes de asignar y no se escribe si ya tiene ese valor. AUDITORÍA: la pasada 2 fija updated_by y NO registra TaskHistory, y no es omisión — _HISTORY_TRACKED_FIELDS (service.py:387-394) es exactamente (status, assignee_id, estimation_points, estimation_hours, sprint_id, priority) y NINGUNO de los cinco está ahí, así que el servicio por el camino de la API tampoco registraría nada; escribir historial aquí produciría entradas que la aplicación nunca genera. Si algún día parent_task_id entra a esa tupla, esta pasada la sigue por el mismo _record_history_diff (service.py:510-535), no por una copia propia"
  - "D-UPD (design) --update-existing reconcilia CUATRO campos vía TaskService.update_task(TaskUpdate(...)): status, priority, due_date y las etiquetas derivadas. completed_at NO se escribe directamente: update_task ya lo deriva al mover de columna conservando el valor previo (service.py:440-442 con current or now() en :862-863), así que la fecha histórica que fijó completed_at_override SOBREVIVE a cualquier --update-existing. Caso residual: una tarea importada abierta que cierra en una corrida posterior y trae «CERRADA el YYYY-MM-DD» recibiría now(); el importador NO la sobrescribe y emite ADVERTENCIA con el ID y las dos fechas. Descartados: añadir completed_at_override a update_task (amplía el alcance más allá del delta de tasks y abre una segunda superficie de escritura que D-INM del 43 mantiene cerrada), escribir task.completed_at a mano tras el update_task (es el «UPDATE posterior» que D8 rechazó) y meterlo en la lista blanca sin advertir (deriva silenciosa). La lista blanca de la spec es una COTA SUPERIOR, no un mandato de escribir los cinco campos; los tres escenarios del requisito quedan cubiertos. H4 — RECONCILIACIÓN DE ETIQUETAS: no es un campo de TaskUpdate (no las declara) sino una operación aparte sobre TaskLabel — se calcula el conjunto DERIVADO de la fila (D-LBL, D-PSPI, D-REC), se aplica ensure_label + assign_label (idempotente, labels/service.py:120-122) y se retira con unassign_label (labels/service.py:125) SOLO sobre etiquetas derivadas, reconocidas por su forma: area:*, apoyo-ia:*, recurrente y pspi:*. Una etiqueta agregada A MANO por el usuario (bloqueada, revisar-con-juridica, cualquier nombre fuera de esos cuatro patrones) NUNCA se retira, aunque no esté en el conjunto derivado: el importador no sabe nada de ella y no tiene autoridad para borrarla. El reporte enumera cada unassign_label aplicado con ID y nombre. H17 — IDEMPOTENCIA REAL: antes de invocar update_task se COMPARAN los valores destino (status, priority, due_date) y el conjunto derivado de etiquetas contra los actuales; si no hay diferencia NO se llama a update_task y la fila se cuenta como sin cambios. Es lo que hace verdadero el escenario 52 incluso con --update-existing, porque update_task escribe updated_at/updated_by en cada invocación y registra TaskHistory cuando cambia status (service.py:501-509): llamarlo por si acaso produciría 135 mutaciones de auditoría que nadie hizo. H21 — ADVERTENCIA OPERATIVA para el runbook: con --update-existing el XLSX MANDA sobre el status; una tarea completada en la aplicación que en la hoja sigue PENDIENTE vuelve a Sin iniciar en la siguiente corrida"
  - "D-BADGE-UI (design, CORREGIDA por H3) La insignia COMPONE el sol-badge de la librería y vive en la ENTIDAD, no en shared: frontend/src/entities/task/ui/origin-badge/origin-badge.component.ts (standalone, entradas source y externalKey, sin output, sin click, sin routerLink), y su plantilla renderiza <sol-badge variant=\"neutral\" size=\"sm\" [attr.aria-label]=\"originAria()\">{{ externalKey() }}</sol-badge>. DOS puntos de uso: widgets/project-workspace/project-workspace.component.ts:285-291 (tabla) y widgets/task-detail-panel/task-detail-panel.component.ts:93-95 (detalle). DOS AFIRMACIONES FALSAS CORREGIDAS: (1) el diseño decía que no existía ningún componente de insignia citando una búsqueda *badge* con «cero resultados» — SolBadgeComponent existe en @solercia/ui y lo consume medio frontend, incluido el propio task-detail-panel (:30, :67, :265); (2) lo ubicaba en frontend/src/shared/ui/, que NO aloja componentes: es un barril puro de una sola línea (export * from '@solercia/ui', shared/ui/index.ts:1-14) cuyo comentario normativo dice que el sol-drawer app-local se eliminó justamente para no duplicar símbolos por ese barril. POR QUÉ entities/task/ui/: por FSD la insignia conoce el vocabulario de la entidad task (source, external_key), así que no es un átomo compartido; entities/task/ ya existe (task-detail.model.ts, task-detail.service.ts) y este componente estrena su subdirectorio ui/. POR QUÉ COMPONER: tono, radio, tipografía y contraste en tema claro y oscuro los resuelve sol-badge con los tokens de la librería; un span propio los reimplementa y se desincroniza en la primera versión de @solercia/ui. Descartados: widgets/task-modal/task-modal.component.ts (no renderiza task_key) y la tarjeta de tablero (:994-1002 muestra un botón «abrir detalle», no la clave). Checklist ux-psicologia aplicado: la insignia NO EXISTE cuando external_key es nulo (nada arranca vacío ni con guion de relleno), no introduce estados de cargando/vacío/error nuevos porque es una hoja presentacional sin carga de datos propia, la ausencia significa «tarea creada a mano» y eso se documenta en vez de dejarse a la inferencia, aria-label con origen y clave («Origen: checklist_xlsx T-05») por el canal text.* de las plantillas anfitrionas, y contraste verificado en tema claro y oscuro (los resuelve sol-badge; no se declara ni un color propio)"
  - "D-EXIT (design, NUEVA en la pasada correctiva H2) TABLA DEFINITIVA de códigos de salida, alineada con la spec y no al revés. El diseño traía 2=archivo no analizable y 3=CSV inválido, que CONTRADECÍA el requisito «Contrato de la CLI import_checklist.py» (specs/checklist-import/spec.md:527), donde 2 es la validación del CSV y 3 el error de base de datos. Dos artefactos del mismo cambio no pueden fijar dos contratos de salida distintos: manda la spec. Reparto definitivo: 0 éxito; 1 USO O ARGUMENTOS (--execute sin --csv-in, falta de conexión declarada en cualquiera de los dos modos, --file inexistente, XLSX NO ANALIZABLE por hoja/encabezado/antibomba/bytes que no son XLSX, y Solicitante que nombra a un miembro sin correo mapeado por --member) -> ChecklistFileError, ChecklistSheetError, ChecklistHeaderError, ChecklistTooLargeError y errores de argparse; 2 CSV DE CONSOLIDACIÓN INVÁLIDO (fila sin decidir, action fuera del vocabulario, referencia a ID inexistente, ciclo o anidamiento encadenado, enlace entre proyectos, referencia a skip/merge_into, y codificación no decodificable) -> ChecklistConsolidationError; 3 ERROR DE CONEXIÓN O BASE DE DATOS; 4 FALLO DE UNA FILA INDIVIDUAL (descripción > 4000, dato imposible de mapear) O EXCEPCIÓN INESPERADA, con la transacción ya revertida -> ChecklistRowError y cualquier Exception no clasificada. POR QUÉ 1 absorbe el XLSX no analizable: para el operador un archivo que no abre es del mismo género que una ruta equivocada (se corrige cambiando la invocación, no el CSV) y así lo enuncia el requisito publicado; la causa exacta viaja en el mensaje tipado, que siempre nombra la hoja, el encabezado o el límite incumplido. El escenario 68 obliga a distinguir 2 de 3, y la prueba de la CLI los afirma POR CÓDIGO, no por texto. El ajuste del paréntesis de spec.md:527 no cambia conteos de requisitos ni de escenarios"
  - "D-LBL-IO (design, NUEVA por H5) ensure_label BUSCA SIN FILTRO DE ESTADO Y REACTIVA ANTES DE CREAR. uq_labels_project_name (labels/models.py:30) es un UniqueConstraint(project_id, name) TOTAL, sin postgresql_where: una etiqueta borrada lógicamente (is_active=False, deleted_at) SIGUE OCUPANDO EL NOMBRE. Un ensure_label que buscara con is_active.is_(True) no la encontraría, intentaría crearla y recibiría un IntegrityError que, dentro de la frontera de D-TX, aborta la corrida entera por una etiqueta que ya existía. Orden: (1) SELECT por (project_id, name) sin filtro de is_active ni deleted_at; (2) si existe inactiva, la REACTIVA (is_active=True, deleted_at=None) y la devuelve; (3) si existe activa, la devuelve; (4) solo si no existe, la crea. Prueba de apoyo en F: test_ensure_label_reactivates_a_soft_deleted_label_instead_of_creating. Descartado capturar el IntegrityError y reintentar: dentro de una transacción con SAVEPOINT un error de integridad invalida el savepoint activo y obliga a un rollback parcial; buscar bien cuesta una condición menos"
  - "D-VAL (design, NUEVA por H6) validate() cierra DOS huecos más del grafo de decisiones, además de las cuatro reglas ya escritas (toda fila decidida, toda referencia existente, sin ciclos, sin enlaces entre proyectos): (a) ANIDAMIENTO ENCADENADO — A -> subtask_of:B cuando B es a su vez subtask_of:C se RECHAZA, porque el servicio no admite sub-subtareas (_resolve_child_type lanza 422 subtask_nesting_not_allowed, service.py:361-366); el CSV usa EL MISMO CÓDIGO DE ERROR en su mensaje para que el operador reconozca la regla del producto y no la crea una limitación del importador, y detectarlo en el CSV evita un rollback total a mitad de la pasada 2. (b) REFERENCIA A UNA FILA QUE NO SOBREVIVE — merge_into:/subtask_of: que apunta a una fila decidida como skip, o a otra fila merge_into:, se RECHAZA: apuntar a una skip referencia una tarea que nunca se crea, y apuntar a una fusionada crea una cadena A -> B -> C donde A queda colgando de una tarea ya en Removida. Ambos casos son visibles en el CSV y no requieren BD. Dos pruebas de apoyo puras en E: test_chained_subtask_of_is_rejected_with_the_service_error_code y test_reference_to_a_skipped_or_merged_row_is_rejected_before_any_write. Descartado resolver la cadena automáticamente (colapsar A->B->C en A->C o redirigir a la superviviente): es justo la clase de decisión que D-CSV le devuelve al usuario"
  - "D-USERS (design, NUEVA por H8) LOS CORREOS INSTITUCIONALES NUNCA ENTRAN AL REPOSITORIO: llegan por --member \"Nombre Apellido=correo@dominio\", REPETIBLE, y esa es la única fuente de la correspondencia nombre -> correo. El diseño y la spec nombran a dos personas reales de una entidad pública; escribir sus correos en seeds.py, importer.py o una prueba los dejaría en el historial de git para siempre — el mismo fallo que la guardia 73 impide para el XLSX, por una puerta más pequeña. Reglas: ensure_users crea o reconcilia SOLO los miembros declarados, por correo; si el CSV o el XLSX asigna una fila a un nombre SIN correo mapeado, el importador termina con SALIDA 1 nombrando ese nombre y no escribe nada — no se deriva un correo del nombre y no se cae silenciosamente al responsable por defecto, porque admin@solercia.com es el destino de un Solicitante NO RECONOCIBLE (texto libre, cargo, área), no de una persona que el operador olvidó declarar; el repositorio contiene como mucho el NOMBRE en un ejemplo de la ayuda de la CLI; los valores reales viven en el runbook operativo, fuera del repositorio; las pruebas usan correos ficticios de dominio de ejemplo. Descartado un members.yaml versionado: mueve el problema de sitio sin resolverlo y añade un formato más que mantener"
