boundary:
  - "Pestaña Backlog reorganizada: sprints como secciones colapsables arriba + sección Backlog abajo (estilo Jira compacto)"
  - "Cabecera de sección: nombre, fechas, badge de estado (reutiliza 29), conteo de historias, suma de horas, acción contextual"
  - "Accion contextual por estado: Iniciar (draft/planned con fechas -> POST /sprints/{id}/start de 29); Completar (active -> POST /sprints/{id}/close existente)"
  - "Agregados calculados en BACKEND (conteo historias/tareas + suma horas estimadas por sprint y del backlog); campos aditivos, SprintRead/burndown/close intactos"
  - "Cuerpo de cada seccion reutiliza allTasks() ya cargado, agrupado por sprint_id (sin fetch extra); cabecera usa conteo autoritativo del servidor"
  - "Estado de colapso persistido en cliente (localStorage por proyecto+seccion); default expandido"
  - "Ids estables por seccion (sprint.id + 'backlog') como seam para drag&drop (31)"
  - "Fuera de alcance: drag&drop (31), estimation_display enriquecido (34), busqueda/filtros (33), crear/editar sprint (29), unicidad de nombres, controles de metodologia (42)"
order_note:
  - "depends_on: [29-sprint-borrador]; el apply se ordena tras cerrar el ciclo de 29 por los seams de draft/start/badge/accion"
facts_verified:
  - "NO existe endpoint de agregados; GET /projects/{id}/sprints devuelve SprintRead[] sin conteos ni sumas (sprints/router.py:22-39, service.list_sprints:36-49)"
  - "Repositorio ya tiene precedente de agregados SQL: sum_done_points_for_sprint (repository.py:126) y count_backlog_points_for_project (repository.py:195) con func.coalesce/func.sum"
  - "Frontend: pestaña Backlog hoy es lista plana de backlogTasks() = allTasks() con sprint_id==null (project-workspace.component.ts:1023-1025, 311-343); Sprints es pestaña aparte con form+tarjetas (346-562)"
  - "El componente ya carga TODAS las tareas (allTasks(), loadTasks:1205) -> los cuerpos de seccion pueden agruparse en memoria por sprint_id sin llamadas extra"
  - "sprintBadgeClass() y logica estado->accion ya existen en el componente (1566-1570, 471-489); el cambio 29 las centraliza y agrega 'draft'"
  - "@solercia/ui 0.3.0 NO expone acordeon/colapsable (solo Sol{Button,Card,Badge,Icon,Tabs,Modal,...} en types/solercia-ui.d.ts) -> colapsable es composicion app-local con signals (espeja el toggle de burndown selectedSprintId:1521-1530)"
  - "Sprint model front: SprintStatus='active'|'closed' (workspace.model.ts:5); el cambio 29 agrega 'draft'"
  - "estimation_hours ya se guarda en horas (Numeric) -> aqui suma simple; estimation_display enriquecido llega con cambio 34 (OLA_4.md:79-82)"
  - "Consecutivo 30 libre en openspec/changes/ y en openspec/changes/archive/ (solo existen 25-29 y 34 activos)"
  - "Capability sprints tiene spec (openspec/specs/sprints/spec.md) -> delta MODIFIED; frontend-ui-consumption NO cubre la vista de backlog (es migracion a la libreria)"
last_updated: 2026-07-20
spec_notes:
  - "Capability: sprints (delta MODIFIED). Sin capability nueva."
  - "Endpoint/lectura propuesta: enriquecer GET /projects/{id}/sprints (item de lista con story_count + estimation_hours_sum) + agregados de backlog; alternativa a evaluar en design: GET /projects/{id}/backlog-overview dedicado"
  - "Frontend es composicion (no spec-level nuevo); el cambio spec-level es el contrato de agregados de la lectura de sprints"
