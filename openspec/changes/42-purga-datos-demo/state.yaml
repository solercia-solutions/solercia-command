boundary:
  - "Compuerta de la semilla demo: SEED_DEMO_DATA=False en Settings, retorno temprano dentro de _ensure_demo_members (db_init.py:586) y _seed_demo_workitems (db_init.py:562); la semilla estructural (org Solercia, admin@, roles, menús, dependencias, alert_rules, ensure_system_templates) sigue siendo incondicional"
  - "Casos de uso en backend/app/maintenance/ (purge.py, bootstrap.py) dueños de la transacción, más CLI delgada backend/scripts/purge_demo_data.py"
  - "Purga física del alcance demo de hoja a raíz, incluidos los huérfanos sin FK: attachments (81), notifications (29), notification_deliveries, reminders (2), assets/asset_licenses/asset_tasks (1)"
  - "Usuarios demo a borrar: ana@, carlos@, diana@, verify-smoke-11@ (nunca admin@solercia.com); organización Acme Consultores borrada, Solercia conservada"
  - "Conectores: se borra únicamente provider='fake' y su cuenta soft-deleted; google, microsoft365 y jira se conservan (jira tiene la cuenta real «Cristian Camilo Calderon Tapia»). Sin flag --include-connectors"
  - "Bootstrap idempotente: SDMUJER (area, planner, SDM), SEGURIDAD (proyecto, custom, SEG, padre SDMUJER), PANDORA (proyecto, kanban, PAN, padre SDMUJER) e intake_settings.default_project_id -> SEGURIDAD"
  - "Tablero de SEGURIDAD con 7 columnas literales en este orden exacto: Sin iniciar, En curso, Diferida, Recurrente, Gestionada aparte, Removida, Completada (Completada ÚLTIMA)"
  - "--purge-upload-files (opcional, apagado por defecto) borra SOLO los archivos de UPLOAD_DIR referenciados por las filas de attachments eliminadas; nunca un borrado genérico del directorio"
  - "Invariantes post-ejecución impresas por el script y verificación manual de que un restart del backend no recrea datos demo"
  - "Fuera de alcance: exclusión de Removida/Gestionada aparte del denominador de avance (diferida al cambio 44), importación del checklist, usuarios Jason/Santiago, planes, tasks.source/external_key (cambio 43), frontend y migraciones Alembic"
module_decision:
  - "Opción A1: la compuerta vive dentro de los helpers de db_init y lee settings.SEED_DEMO_DATA en tiempo de llamada; nunca ligada a una constante de módulo (settings es singleton cacheado, config.py:317-324, y la convención de pruebas es monkeypatch.setattr sobre el atributo)"
  - "Opción B1: caso de uso en app/maintenance/ + CLI delgada, no endpoint HTTP (expondría una operación destructiva) ni migración Alembic de datos (rompe «migraciones = esquema» de dev-tooling R4/R5 y no admite dry-run)"
  - "Opción C1: Completada como última columna. El estado terminal es posicional (allowed_statuses()[-1]) en tasks/service.py:854-864, sprints/service.py:271 y projects/repository.py:322-326; con el orden del plan, Removida sería «hecho». Cero cambios en Strategy, roll-up, dashboard y sprints"
  - "Los proyectos se crean con ProjectService._create_project_unit (precedente org_role_templates/service.py:295) porque create_project fuerza project_kind=proyecto y SDMUJER es area (projects/service.py:117-119)"
  - "Las 7 columnas se persisten al estilo BoardRepository.create_for_project (literales, order 0..6, sin commit). NUNCA BoardService.add_column: slugifica (boards/service.py:203) y hace commit por columna (:221), rompiendo la atomicidad"
  - "Como seed_board ya crea un Board vacío y boards.project_id es UNIQUE, el bootstrap añade columnas al tablero existente de SEGURIDAD; no crea un segundo tablero"
facts_verified:
  - "seed_default() corre en cada arranque (main.py:104) tras alembic upgrade head (backend/docker/entrypoint.sh:8-9)"
  - "_ensure_demo_members se invoca SIN condición (db_init.py:360): ana/carlos/diana reviven en cada arranque aunque existan tareas"
  - "_seed_demo_workitems se dispara con COUNT(tasks) == 0 GLOBAL (db_init.py:367-369), sin filtro de organización ni is_active"
  - "_seed_demo_tasks usa strategy.allowed_statuses() or ['todo','doing','done'] (db_init.py:692-693): en un tablero custom generaría estados inexistentes dentro de los proyectos reales"
  - "_ensure_demo_projects devuelve los proyectos existentes si la organización ya tiene alguno activo (db_init.py:617-650): los proyectos reales serían el destino de las tareas demo"
  - "CustomStrategy.default_columns() == [] y allowed_statuses() == [] (methodology/custom.py:12-16); los estados vivos salen de board_columns.status_key vía BoardAwareStrategy (methodology/board_aware.py:39-51)"
  - "El denominador de avance excluye solo el literal cancelled (projects/repository.py:330), normativo en specs/project-hierarchy/spec.md:113"
  - "status_key es inmutable tras crearse (boards/models.py:62-65), único por tablero (uq_board_column_status_key) y String(60); boards.project_id es UNIQUE (:36-37)"
  - "org_role_templates y org_role_template_nodes son catálogo de sistema (organization_id IS NULL, is_system=true), exigidos por specs/org-role-templates/spec.md:29 y recreados por ensure_system_templates (org_role_templates/seeder.py:91-118)"
  - "Tablas sin FK que no caen por CASCADE: attachments (target_type/target_id), notifications (target_type/target_id, dedup_key 'task_overdue:{id}'), notification_deliveries (SET NULL), reminders.task_id (SET NULL), projects.parent_project_id (SET NULL, obliga a borrar de hoja a raíz)"
  - "connected_accounts.user_id es ON DELETE CASCADE (connectors/models.py:91-93): borrar usuarios podría destruir cuentas conectadas"
  - "Base real 2026-08-26: conector fake (activo, cuenta fake-account-qa-demo-1 soft-deleted, dueño admin@) es demo; google y microsoft365 (sin cuentas) y jira (cuenta «Cristian Camilo Calderon Tapia», dueño admin@) son reales"
  - "Base real 2026-08-26: ninguna connected_account pertenece a un usuario demo, así que el CASCADE desde users no destruye cuentas reales"
  - "Conteos previos 2026-08-26: attachments 81 (todas target_type=task), notifications 29 (asset_license/sprint/task), notification_deliveries 0, reminders 2, alert_rules 7 (se conservan), org_role_template_instantiations 12, user_roles 6, board_columns 86, task_comments 73, task_history 145, 17 tareas asignadas a usuarios demo"
  - "Base real 2026-08-26: único asset «Verify Test Asset» (org Solercia, responsable admin@, soft-deleted 2026-07-12) es artefacto de verificación; ≈1963 archivos en backend/uploads/"
  - "pg_dump NO existe en la imagen del backend (backend/Dockerfile:10-12, python:3.12-slim que instala y elimina gcc): el respaldo se toma desde el host contra gestion_proyectos-postgres-1"
  - "DATABASE_URL por defecto apunta a postgres:5432 (config.py:24), solo válido dentro de la red Docker; desde el host se requiere --database-url postgresql+asyncpg://app:app@127.0.0.1:5434/solercia (docker-compose.yml:16-17)"
  - "backend/scripts/ NO existe: sería el primer script operativo del repo; el Makefile solo cubre calidad de frontend y delega el ciclo de vida en gestion.sh"
  - "Harness de pruebas: session aislada por SAVEPOINT (conftest.py:87-110) resiste commits del código bajo prueba; precedente de probar la semilla con helpers privados en tests/test_menu_seed.py:13,26-29; precedente de parchear settings en tests/test_email_outbox.py:39; ningún test invoca seed_default() hoy"
  - "intake_settings.default_project_id es FK ON DELETE SET NULL (intake/models.py:164-166); si queda nulo, IntakeService._ensure_default_project crea perezosamente el proyecto «Tareas Outlook» (intake/service.py:581-599)"
