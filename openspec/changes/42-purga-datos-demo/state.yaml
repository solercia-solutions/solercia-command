spec_notes:
  - "Capacidad nueva: data-maintenance (openspec/specs/data-maintenance/spec.md). Requisitos a especificar: compuerta SEED_DEMO_DATA con default false y semilla estructural incondicional; purga idempotente con dry-run por defecto y execute explícito; respaldo obligatorio verificado antes de cualquier borrado; borrado explícito de huérfanos sin FK; protección del catálogo de sistema y de los conectores reales; fallo cerrado si una connected_account pertenece a un usuario a borrar; bootstrap idempotente de SDMUJER/SEGURIDAD/PANDORA; tablero de 7 columnas con Completada última; intake_settings.default_project_id apuntado a SEGURIDAD; invariantes post-ejecución"
  - "api-conventions: MODIFIED R4/R5 (la semilla demo queda condicionada por SEED_DEMO_DATA; la estructural sigue siendo incondicional) y su descripción :20; ADDED requisito que acota R3 (borrado suave) al dominio en tiempo de ejecución y autoriza el borrado físico como operación de mantenimiento con respaldo previo y confirmación explícita"
  - "multi-tenancy: MODIFIED R4 (:31) — los miembros demo pasan a ser condicionales; la organización Solercia y el admin siguen siendo incondicionales"
  - "org-role-templates: ADDED escenario — la purga borra las instancias de proyecto y su ledger (org_role_template_instantiations), nunca el catálogo de sistema, que ensure_system_templates recrea en cada arranque"
  - "intake-classifier: ADDED escenario — con intake_settings.default_project_id ya apuntado, no se crea el proyecto perezoso «Tareas Outlook»"
  - "SIN delta a projects, project-hierarchy, methodology-strategies, boards ni dashboard-executive: la opción C1 (Completada última) no toca la resolución del estado terminal ni el roll-up"
  - "Escenarios Dado/Cuando/Entonces y palabras clave RFC 2119 (DEBE, DEBERÍA, PUEDE) según openspec/config.yaml"
