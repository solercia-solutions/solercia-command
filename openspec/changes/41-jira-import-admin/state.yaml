phases:
  proposal: done
  spec: done
  design: done
  tasks: done
  apply: pending
  verify: pending
  archive: pending
artifacts:
  proposal: true
  design: true
  specs: true
  tasks: true
capabilities:
  new:
    - jira-import-admin
  modified: []
target_capabilities:
  - jira-import-admin
constraints:
  - reuse-40-persistence-pipeline
  - idempotent-by-jira-key
  - resumable-batch-import
  - persisted-job-state
  - token-never-in-repo-fernet-encrypted
  - basic-throttling-reuse-429-backoff
  - tdd-strict-httpx-mocktransport
