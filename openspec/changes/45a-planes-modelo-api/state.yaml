verification:
  test_command: "cd backend && TEST_DATABASE_URL=postgresql+asyncpg://app:app@127.0.0.1:5434/solercia_test .venv/bin/python -m pytest -q tests/test_migration_institutional_plans.py tests/test_plans_repository.py tests/test_plans_service.py tests/test_plans_endpoints.py tests/test_migrations_baseline.py"
  gate: "El gate REAL del espejado es la prueba de equivalencia de DDL (pg_get_indexdef / pg_get_constraintdef entre alembic upgrade head y Base.metadata.create_all). alembic check se conserva solo como guardia de existencia por nombre: verificado sobre 1.14.0 que no compara CheckConstraint ni postgresql_where"
  criteria:
    - "Migración sobre base desechable: upgrade a 0027 (head anterior) -> siembra por SQL crudo con asyncpg (con is_active explícito) -> upgrade 0028 -> aserciones sobre information_schema (5 tablas, 5 únicos, el CHECK, los 9 índices) -> downgrade 0027 -> las cinco tablas ausentes y las filas sembradas intactas"
    - "Roll-up cruzado contra PostgreSQL real: una actividad con dos tareas primary en DOS proyectos con boards de columnas distintas reporta el avance correcto usando la última columna del board de CADA tarea; los enlaces contributes no alteran la razón"
    - "null != 0: una actividad sin enlaces primary responde calculated_progress: null; una con enlaces y ninguna tarea terminada responde 0"
    - "Aislamiento de tenant en toda lectura: para cada uno de los 5 endpoints de lectura, un usuario de la organización B recibe 404 sobre un plan o una actividad de A y ningún listado incluye filas de A"
    - "RBAC: los 5 endpoints de escritura responden 403 a member y viewer, y 200/204 a admin y manager"
    - "Idempotencia: dos PUT consecutivos del mismo (activity, period) dejan una sola fila; dos POST del mismo (task, activity) no crean duplicado; un enlace hacia la misma actividad rechaza por el CHECK"
    - "Sin regresión frente a la línea base RE-MEDIDA al iniciar cada rebanada, con TEST_DATABASE_URL configurada"
