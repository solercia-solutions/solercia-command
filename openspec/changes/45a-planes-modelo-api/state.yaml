  - "R8 N+1 al calcular el avance de un listado: 62 actividades reales (25 + 26 + 11) con una consulta por actividad — Media — el roll-up se resuelve en UNA sola consulta agregada por lote de actividades; prueba con conteo de consultas o con lote representativo"
  - "R9 Frontera ADR 0009: la tentación de guardar en Command el monitoreo y la evaluación independiente del PAI porque «están en la misma hoja» — Media — D5 escrita como frontera en propuesta, spec y diseño; las columnas AA/AB/AC no existen en el modelo"
  - "R10 Cinco tablas de una sola vez en una migración — Baja — Alembic corre la migración dentro de una transacción en PostgreSQL: o entran las cinco o no entra ninguna. El downgrade se ejercita en la propia prueba"
  - "R11 Nombres de identificadores sin naming_convention en Base: toda restricción se nombra explícitamente — Baja — el más largo, ix_plan_activity_reports_plan_activity_id, mide 41 caracteres frente al límite de 63 de PostgreSQL"
  - "R12 (diseño, NUEVO) paginate(...) AGREGA cláusulas de orden en vez de reemplazarlas (shared/pagination.py:110-112): si el repositorio deja un order_by natural en el Select y además lo pasa a paginate, el resultado es un ORDER BY encadenado y contradictorio, sin error visible — Baja/Media — el repositorio construye el Select SIN order_by y decide después según el camino (D-L)"
  - "R13 (diseño, NUEVO) El rango 0-100 del avance reportado NO lo defiende el motor: el alcance ratificado fija un solo CHECK (ck_plan_activity_links_no_self) y no se agrega uno de rango — Baja — la defensa es validate_reported_progress en el servicio (código estable plan_progress_out_of_range 422); el 45b, único otro escritor, DEBE llamarla antes de usar la costura del repositorio. Anotado como mejora barata (un CHECK aditivo) para ese cambio si la práctica lo exige"
  - "R14 (diseño, NUEVO, pasada correctiva 2026-08-26, H12) El period de un reporte NO se contrasta con scheduled_periods de la actividad ni con el plan_type de su plan: se puede registrar un reporte del cuatrimestre III en una actividad cuya fuente solo programaba I y II — Baja — RIESGO ACEPTADO Y ESCRITO, no omisión. Ningún requisito de la spec lo exige: el requisito de escritura (spec.md:148) solo acota el periodo al vocabulario {I, II, III, ANUAL}. scheduled_periods es un dato DESCRIPTIVO de la fuente, no una restricción de negocio, y el importador del 45b no puede garantizar que esté completo en los tres documentos; convertirlo en validación bloquearía reportes legítimos por un dato de calidad desconocida. Si el negocio lo pidiera, es una comprobación de servicio en upsert_report (cero migraciones, D12) y un requisito nuevo con su propio escenario"
  - "R15 (diseño, NUEVO, pasada correctiva 2026-08-26, H16) El DELETE de enlaces es FÍSICO (D-C) y no deja deleted_by: queda registrado quién CREÓ el enlace, nunca quién lo QUITÓ — Baja — RIESGO ACEPTADO. task_history pertenece al agregado tasks y no cubre task_plan_activities ni plan_activity_links; el registro de aplicación conserva la petición pero no es evidencia consultable desde el producto. Se acepta porque desenlazar una tarea de una actividad NO es una afirmación institucional —lo es el reporte del periodo, que SÍ conserva updated_by/updated_at (D-C/H9)— y porque el soft delete traería el fallo del único retenido. ALTERNATIVA FUTURA si el negocio lo exige: una tabla de bitácora propia del módulo (plan_link_events) escrita en el mismo caso de uso, NUNCA SoftDeleteMixin"
  - "Los riesgos 3, 4, 6, 7, 8, 10, 11, 12 y 13 de la exploración pertenecen al 45b (fuentes, importadores, confidencialidad de los documentos reales) o al 45c (ausencia de runner de pruebas de frontend) y NO se arrastran al 45a"
