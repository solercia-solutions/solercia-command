boundary:
  - "Migración 0028_add_institutional_plans (down_revision 0027, sujeta a compuerta en vivo): CINCO tablas nuevas — plans, plan_activities, plan_activity_reports, plan_activity_links, task_plan_activities — con FKs ON DELETE CASCADE, índices, cinco únicos de alcance y el CHECK ck_plan_activity_links_no_self. Ninguna tabla preexistente se toca"
  - "plans (TenantMixin, PkMixin, TimestampMixin, SoftDeleteMixin, AuditMixin): code String(20), name String(255), plan_type String(20) en {pspi, ptr, pai, ptep}, period_year Integer, version String(50), source_document String(500), status String(20) default 'active'. UNIQUE (organization_id, code) -> uq_plans_org_code; INDEX (organization_id, plan_type, period_year) -> ix_plans_org_type_year"
  - "plan_activities (sin organization_id; tenant transitivo por plan_id): code String(20), group_code String(20), group_name String(255), name Text, deliverable Text, evidence_expected Text, responsible String(255), is_mine Boolean default false, due_date Date, target_from/target_to Numeric(5,2), iso_controls JSONB, external_codes JSONB (PLURAL: PSPI 2.4 lleva OM-05 y OM-08), scheduled_periods JSONB, sort_order Integer default 0. UNIQUE (plan_id, code) -> uq_plan_activities_plan_code; INDEX (plan_id, is_mine) -> ix_plan_activities_plan_is_mine"
  - "plan_activity_reports: period String(10) en {I, II, III, ANUAL}, reported_progress Numeric(5,2), qualitative_summary Text, evidence_refs JSONB, is_met Boolean, met_on_time Boolean. UNIQUE (plan_activity_id, period) -> uq_plan_activity_reports_activity_period. NO lleva reported_at/reported_by: TimestampMixin y AuditMixin ya los aportan"
  - "plan_activity_links: from_activity_id, to_activity_id, link_type String(20) default 'contributes_to', source_reference String(50) con el texto literal de la fuente, resolution String(20) en {exact, by_external_code, conflict, manual}. UNIQUE (from_activity_id, to_activity_id, link_type) -> uq_plan_activity_links_from_to_type; CHECK (from_activity_id <> to_activity_id) -> ck_plan_activity_links_no_self"
  - "task_plan_activities: task_id FK tasks ON DELETE CASCADE, plan_activity_id FK plan_activities ON DELETE CASCADE, role String(20) en {primary, contributes}, note Text. UNIQUE (task_id, plan_activity_id) -> uq_task_plan_activities_task_activity"
  - "Espejado literal de TODOS los objetos de esquema en __table_args__ de cada modelo, porque tests/conftest.py construye el esquema con Base.metadata.create_all y no con Alembic. El gate REAL es una prueba de equivalencia de DDL (pg_get_indexdef / pg_get_constraintdef entre create_all y upgrade head), NO alembic check, que en 1.14.0 no compara CheckConstraint ni postgresql_where (lección verificada del 43, D-B)"
  - "activity_key = f\"{plan.code}/{activity.code}\" -> 'PSPI-2026/1.1'. Campo TRANSITORIO del esquema Pydantic calculado en el servicio, jamás columna; mismo patrón que task_key (tasks/service.py:967). Es el token que consume el CSV del 44 (D7) y el enlazador del 45b"
  - "Doble avance: calculated_progress = tareas primary en la última columna activa del board de SU PROPIO proyecto ÷ tareas primary activas no excluidas del avance. NULL cuando no hay enlaces primary, NUNCA 0. Los enlaces contributes NO entran en la razón: se exponen como contributing_task_count. reported_progress = el valor del periodo consultado en plan_activity_reports, o null si ese periodo no tiene reporte"
  - "Roll-up cruzado: CTE DISTINCT ON (board.project_id) ... ORDER BY column_order DESC, created_at DESC UNIDO por board.project_id = task.project_id (no filtrado a un proyecto), conservando Board.is_active y BoardColumn.is_active. Es SQL NUEVO en el módulo plans, no una reutilización de projects/repository.py:290-347"
  - "Router /api/v1/plans — LECTURA (cualquier miembro): GET /plans (?plan_type=&period_year=&status=), GET /plans/{plan_id}, GET /plans/activities (?plan_id=&plan_type=&is_mine=&group_code=&task_id=&period=), GET /plans/activities/{activity_id}, GET /plans/activities/{activity_id}/tasks (?role=)"
  - "Router /api/v1/plans — ESCRITURA (require_role admin, manager): PUT /plans/activities/{activity_id}/reports/{period} (upsert idempotente), POST /plans/activities/{activity_id}/tasks, DELETE /plans/activities/{activity_id}/tasks/{task_id}, POST /plans/activities/{activity_id}/links, DELETE /plans/activities/{activity_id}/links/{link_id}"
  - "La ruta estática GET /plans/activities DEBE declararse ANTES que GET /plans/{plan_id}, o FastAPI intentará convertir 'activities' en UUID y devolverá 422 en lugar de la lista"
  - "Cableado (CITAS CORREGIDAS EN LA PASADA 2026-08-26): app/main.py:14-53 (import) y :158-192 (bloque de include_router con prefix=API_PREFIX; HEAD ya trae assistant_router en :192, del cambio 48, así que el include_router del 45a va DESPUÉS de esa línea); app/db_init.py:41-96 (import de los 5 modelos con # noqa: F401, cuya razón correcta es POBLAR Base.metadata para create_all —conftest.py:66-69—, NO «para que las relationship() por cadena resuelvan»: los modelos del 45a no declaran ninguna relationship(), D-H). NO se toca _MENU_SEED ni _ROLE_MENU_SEED (D13)"
  - "Fuera de alcance: importadores DOCX/XLSX, enlazador, mapa semilla y CLI (45b); vista, entidad de frontend, rutas, i18n e ícono (45c); entrada de menú (D13, recomendada para el 45c); creación de planes y actividades por HTTP (D10); PTEP-2026 sin fuente (P1); monitoreo cualitativo, evaluación independiente y observaciones-recomendaciones del PAI, columnas AA/AB/AC (D5, ADR 0009); cambios en tasks más allá de la FK; redefinir el criterio de exclusión del avance (es del 44)"
module_decision:
  - "D1 (exploración) Identificador público: columna code con unicidad de alcance + activity_key derivado y transitorio, SIN public_id. public_id tiene CERO apariciones en backend/; la forma canónica del repositorio es projects.code + UniqueConstraint(organization_id, code) y tasks.task_number expuesto como task_key transitorio. Desviación declarada frente a la redacción literal de la decisión del usuario («N:N con public_id»), no frente a su intención (identificador público estable y legible)"
  - "D2 (exploración, CORREGIDA POR D-F EN LA PASADA CORRECTIVA 2026-08-26, hallazgo H1) Modelo de cinco tablas: external_codes en PLURAL (PSPI 2.4 lleva OM-05 y OM-08), sin reported_progress redundante en plan_activities, sin reported_at/reported_by (los aportan los mixins), resolution + source_reference en los enlaces, CHECK anti-autorreferencia y sin denormalizar organization_id. CORRECCIÓN: la redacción original añadía «el avance reportado vigente se calcula como el ÚLTIMO PERIODO CON REPORTE». Esa regla QUEDA SIN EFECTO: manda D-F. Sin ?period= el avance reportado es null y el sistema NO elige un periodo por el usuario, porque specs/institutional-plans/spec.md:86 dice literalmente «el valor registrado para EL PERIODO CONSULTADO, o ausencia de dato si ese periodo no tiene reporte». Devolver el último con reporte equivaldría a presentar el dato del cuatrimestre I como si fuera el del II. Todo lo demás de D2 sigue vigente"
  - "D3 (exploración) Doble avance con null != 0. Cero enlaces primary significa «sin evidencia», no «cero por ciento»: colapsarlos produciría una afirmación falsa ante un ente de control. La UI muestra dos barras y NUNCA rellena una con la otra"
  - "D4 (exploración) Lectura de DOCX por zipfile + xml.etree de la biblioteca estándar. Aplica al 45b; se registra en el 45a porque fija que este cambio NO agrega dependencias a requirements.txt"
  - "D5 (exploración) Frontera ADR 0009: Command guarda SOLO el autorreporte de primera línea (% de avance cuatrimestral, avance cualitativo, evidencia, se cumplió la actividad, se cumplió en la fecha). NO modela monitoreo cualitativo (AA), evaluación independiente (AB) ni observaciones-recomendaciones (AC): docs/adr/0009-...:78-80,238-240 reserva a Security la autoridad sobre cumplimiento, validación y cierre de evidencia. Es frontera declarada, no omisión"
  - "D6 (exploración) Conflictos registrados, nunca resueltos en silencio. El 45a entrega el SOPORTE DE DATOS (resolution + source_reference persistidos y consultables); la política de resolución la ejerce el importador del 45b. Un enlace con resolution='conflict' jamás se cuenta como enlace confirmado"
  - "D7 (exploración) Formato de plan_links para el CSV del 44: 'PSPI-2026/1.1:primary;PAI-2026/12.4:contributes'. La clave es EXACTAMENTE activity_key, lo que obliga a que D1 exista antes de que el 44 lo emita"
  - "D8 (exploración, RE-ANCLADA POR EL ORQUESTADOR 2026-08-26, segunda corrección) Migración 0028 con down_revision='0027'. Historia del número, que es una RECLAMACIÓN y no una promesa: (1) 0028 original; (2) 0029 cuando el 44 pasó a reclamar DOS migraciones; (3) de vuelta a 0028 al ELIMINARSE la reserva de 0026 para el cambio 40, que no entra en esta ola — un down_revision hacia una revisión que nadie va a crear rompe alembic upgrade en DESPLIEGUE, no en la prueba. Cadena definitiva: 43->0025; 44->0026 (board_columns) + 0027 (tasks); 45a->0028; el 40 toma el siguiente consecutivo LIBRE cuando se aplique. Regla derivada: no se reserva número para un cambio que no entra en la ola. Confirmada por compuerta en vivo en la Fase 0"
  - "P1 (exploración) plan_type con los CUATRO valores desde el día uno (pspi, ptr, pai, ptep) aunque solo tres sean importables: incluir ptep ahora evita una migración cuando aparezca la fuente del PTEP-2026"
  - "P3 (exploración) require_role(MemberRole.admin, MemberRole.manager) para escribir; lectura para cualquier miembro autenticado. Un reporte cuatrimestral es una afirmación institucional; leerlo no lo es"
  - "P5 (exploración) Tabla semilla versionada de enlaces PAI con T-63 incluido: alcance del 45b"
  - "P7 (exploración) plan_activities NO denormaliza organization_id; el tenant llega transitivamente por plan_id -> plans.organization_id y toda consulta hace el JOIN explícito. Ratificado con prueba de aislamiento de tenant POR ENDPOINT, no una sola global"
  - "P2, P4, P6 resueltas fuera del 45a: P2 (seguimiento 2025/2026 del PAI) y P6 (R26/R32 sin OM) son del 45b; P4 quedó cerrada en D8"
  - "D9 (propuesta, NUEVA) La exposición del lado de la tarea NO entra en TaskRead: se sirve con GET /plans/activities?task_id=. Embeber una relación en TaskRead obligaría a carga anticipada en TODOS los caminos de lectura de tareas (listado, detalle y GET /dashboard/executive comparten TaskRead.model_validate con from_attributes), porque un acceso perezoso a una relación en SQLAlchemy async falla en ejecución; es un cambio de rendimiento y de acoplamiento (tasks -> plans) desproporcionado para el 45a y dejaría tasks como capacidad modificada por un campo que nadie consume todavía. Si el 45c demuestra que la insignia del modal lo necesita embebido, ESE cambio será dueño del delta de tasks"
  - "D10 (propuesta, NUEVA) La escritura de planes y actividades vive en el REPOSITORIO como upsert idempotente por code, SIN superficie HTTP. De negocio: la autoridad de un plan del Decreto 612 es su documento fuente; un formulario crearía una segunda ruta de autoría que divergiría del documento y chocaría con la idempotencia por (plan.code, activity.code) del importador. Técnica: entregar la costura en el 45a evita que las pruebas siembren por un camino que la aplicación no usa (el error que el 43 corrigió con D-G) y le da al 45b un único punto de escritura"
  - "D11 (propuesta, NUEVA) El reporte del periodo se escribe con PUT /plans/activities/{id}/reports/{period} idempotente, no con POST + PATCH. El único (plan_activity_id, period) hace que «crear» y «actualizar» sean el mismo hecho de negocio —el responsable ajusta su reporte varias veces antes del corte— y un POST devolvería 409 en el segundo intento legítimo"
  - "D12 (propuesta, NUEVA) Vocabularios cerrados como String(n) validado en el servicio, NUNCA SAEnum: plan_type, status, period, role, link_type y resolution. Un enum de PostgreSQL obligaría a una migración por cada valor nuevo. Precedentes: connectors.provider («deliberately NOT a PG enum»), tasks.status String(60) validado por la strategy, y D3 del 43"
  - "D13 (propuesta, NUEVA, DIVERGENCIA DECLARADA frente al alcance dictado) El menú «Planes» se DIFIERE al 45c. _ensure_menus (db_init.py:431-456) siembra menús GLOBALES en cada arranque y solo INSERTA los faltantes (match por Menu.name): nunca actualiza order, icon ni path de una fila existente. Sembrar «Planes» con path=/plans en el 45a pondría, en todas las organizaciones, un enlace de barra lateral hacia una ruta que no existe hasta el 45c -> comodín/404 para todo usuario. Como el sembrado nunca necesita migración de datos, diferirlo no cuesta nada: la entrada aparece en el siguiente arranque tras el 45c. Si el orquestador prefiere sembrarlo en el 45a, la entrada entra en la rebanada F con order=7 (libre, tras «Conexiones»; renumerar la semilla NO afecta a una base ya sembrada) y suma ~35 líneas al presupuesto de F"
  - "D14 (propuesta, NUEVA) La API nunca acepta resolution del cliente: todo enlace creado por HTTP es 'manual' por construcción. Los valores exact, by_external_code y conflict son afirmaciones sobre la LECTURA DE UNA FUENTE y solo el importador del 45b puede emitirlos; aceptarlo por API permitiría marcar como «exacto» un enlace que ningún documento respalda"
  - "D-A (diseño, NUEVA) Migración 0028_add_institutional_plans con down_revision='0027' (re-anclada por el orquestador el 2026-08-26; ver D8) y CINCO op.create_table en orden de dependencia (plans -> plan_activities -> plan_activity_reports -> plan_activity_links -> task_plan_activities), constraints declaradas DENTRO de cada create_table (incluido el CheckConstraint, porque la tabla es nueva y produce el mismo pg_get_constraintdef que un create_check_constraint posterior), índices con op.create_index(op.f(...)) y downgrade en orden inverso estricto. Sin batch_alter_table (cero apariciones en 24 migraciones). Rechazadas: cinco migraciones separadas (multiplica por cinco la superficie de R2) y omitir los drop_index explícitos (contra la convención de 0019:293-320). GOTCHA: SoftDeleteMixin declara is_active con default de Python y SIN server_default, así que toda siembra por SQL crudo en la prueba de migración debe informarlo explícitamente"
  - "D-B (diseño, NUEVA) El gate real del espejado es la equivalencia de DDL (pg_get_indexdef de los 9 índices + pg_get_constraintdef de los 5 únicos y el CHECK) entre alembic upgrade head y Base.metadata.create_all; alembic check 1.14.0 se conserva SOLO como guardia de existencia por nombre. El orden CREATE EXTENSION pg_trgm -> import app.db_init -> create_all es obligatorio: sin el import, Base.metadata no tiene tasks/organizations/users y las FKs de las cinco tablas nuevas ni siquiera podrían crearse"
  - "D-C (diseño, NUEVA; ampliada en la pasada correctiva 2026-08-26 por H8 y H9) plan_activity_reports, plan_activity_links y task_plan_activities NO llevan SoftDeleteMixin. Precedente literal TaskLabel (labels/models.py:43, class TaskLabel(PkMixin, TimestampMixin, Base), docstring «no SoftDeleteMixin — unlinking removes the row outright»); por contraste TaskDependency (task_links/models.py:23-35) sí lo lleva porque una dependencia entre tareas es un hecho con historia. DISCREPANCIA DOCUMENTADA (H8): openspec/specs/labels/spec.md:12 describe TaskLabel como «Pk + Timestamp + SoftDelete», lo que el código contradice; EL PRECEDENTE ES EL CÓDIGO y corregir esa spec es un cambio aparte — el 45a no modifica la capacidad labels. DOS JUSTIFICACIONES DISTINTAS, no una (H9): (a) para los DOS enlaces —task_plan_activities y plan_activity_links— el motivo es el único retenido: con soft delete, uq_task_plan_activities_task_activity y uq_plan_activity_links_from_to_type conservarían la tupla tras desenlazar y el siguiente POST legítimo daría UniqueViolation -> 500, el fallo que el 43 corrigió con su D-I; (b) para plan_activity_reports el motivo es OTRO, porque esa tabla NO TIENE OPERACIÓN DE DESENLACE: no existe DELETE de reportes en toda la superficie del cambio, el único camino de escritura es el PUT idempotente (D11) que reemplaza en la MISMA fila, y un SoftDeleteMixin protegería un borrado que nunca ocurre además de permitir que un reporte desactivado conviviera con uno activo del mismo periodo, que es lo que spec.md:35 prohíbe. plans y plan_activities SÍ llevan SoftDeleteMixin (son agregados). AuditMixin se conserva en las tres: updated_by/updated_at del reporte es la firma de quién afirmó el avance y cuándo"
  - "D-D (diseño, NUEVA; nota de regla reformulada en la pasada correctiva 2026-08-26 por H15) El alcance de tenant es UNA función compuesta por todas las consultas, no una convención: _activity_scope(organization_id) (JOIN plans + organization_id + is_active de plan y actividad) y su gemelo puntual _require_activity, que devuelve None tanto para inexistente como para ajena y el servicio traduce ambas al mismo 404 sin distinguir (no filtra existencia). Ninguna de las ONCE consultas de lectura (list_plans, get_plan, count_activities_by_group, list_activities, get_activity, list_activity_tasks, list_links, rollup_activity_progress, list_reports_for_period, _require_activity, get_link) escribe su JOIN plans a mano. REFORMULACIÓN DE LA NOTA DE REGLA (H15): denormalizar organization_id en plan_activities NO ESTÁ PROHIBIDO POR NINGUNA REGLA, simplemente NO ES EXIGIDO — agents/rules/solercia-persistence.md:42 pide «organization_id OR AN EQUIVALENT TENANT SCOPE» y el JOIN plans es exactamente ese alcance equivalente. El respaldo as-built es openspec/specs/multi-tenancy/spec.md:24: «Task, Sprint y User NO llevan organization_id; su scope se deriva por join (Task/Sprint -> Project)». Denormalizar sería la desviación frente al precedente, no el cumplimiento de la regla. La prueba de aislamiento POR ENDPOINT se conserva: centralizar reduce la probabilidad, no autoriza a dejar de comprobar"
  - "D-E (diseño, NUEVA) El criterio de exclusión del avance vive en backend/app/modules/plans/progress.py como progress_denominator() -> ProgressDenominator(predicate, extra_joins). Devuelve JOINS además del predicado porque el criterio del 44 (board_columns.excluded_from_progress + tasks.context_group IS NULL) necesita un LEFT JOIN que el actual (Task.status != 'cancelled') no necesita: con un retorno solo-predicado habría que editar además el CTE y el «único punto» dejaría de serlo justo cuando importa. Una sola prueba, test_progress_denominator_matches_the_current_criterion, cambia con él"
  - "D-F (diseño, NUEVA; PREVALECE SOBRE D2 EN EL PUNTO DEL AVANCE REPORTADO, hallazgo H1 de la pasada correctiva 2026-08-26) Doble avance con UNA sola regla de null: primary_task_count == 0 => calculated_progress = None. Cubre los dos casos (sin enlaces primary, y con enlaces pero ninguno contable) y elimina por construcción la división por cero. contributing_task_count NO pasa por progress_denominator(): es informativo, no denominador. Sin ?period=, reported_progress y reported_period son ambos None: el sistema NO elige un periodo por el usuario. RESPALDO LITERAL DE LA SPEC (specs/institutional-plans/spec.md:86): «El avance reportado DEBE ser el valor registrado para EL PERIODO CONSULTADO, o ausencia de dato si ese periodo no tiene reporte». Esto CORRIGE la frase de D2 que decía «el avance reportado vigente se calcula como el último periodo con reporte». TERCERA CONSECUENCIA (H12): el period recibido se valida contra el vocabulario cerrado y contra NADA MÁS — no se contrasta con scheduled_periods ni con plan_type; queda como riesgo aceptado y escrito (R14)"
  - "D-G (diseño, NUEVA) Roll-up cruzado en UNA consulta agregada por lote con count(...) FILTER (misma construcción que projects/repository.py:335-338), CTE last_column DISTINCT ON (board.project_id) unido por last_column.project_id = task.project_id, y tenant comprobado DOS veces (plans.organization_id por el lado actividad, projects.organization_id por el lado tarea). Coste total de un listado: TRES consultas fijas (página + roll-up + reportes del periodo), independientes de N. Rechazadas: una consulta por actividad (R8 literal), tres agregadas separadas y reutilizar ProjectRepository.rollup_progress (su CTE filtra el subárbol de un proyecto: por construcción no ve dos proyectos no emparentados). EXPLÍCITO (H3): el roll-up NO LEE plan_activity_links — sus únicas tablas son task_plan_activities, plan_activities, plans, tasks, projects y el CTE last_column—, así que un enlace actividad<->actividad con resolution='conflict' NO PUEDE alterar ningún avance por construcción del FROM, no por disciplina"
  - "D-H (diseño, NUEVA) CERO relationship() en los cinco modelos: el JOIN plans nunca es opcional (D-D), un acceso perezoso a una relación no cargada FALLA en ejecución en SQLAlchemy async, y el ON DELETE CASCADE lo declara PostgreSQL en la FK. Consecuencia declarada: el import en db_init.py:41-96 con # noqa: F401 sigue siendo obligatorio, pero por poblar Base.metadata para create_all (conftest.py:66-69), NO «para que las relationship() por cadena resuelvan» como decía la propuesta"
