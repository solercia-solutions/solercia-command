proposal_notes:
  - "Capacidad NUEVA única: institutional-plans. CERO capacidades modificadas. Las dos candidatas se examinaron y se descartaron con razón escrita: tasks (D9, la exposición del lado de la tarea se sirve con GET /plans/activities?task_id= en lugar de TaskRead) y project-hierarchy (su requisito de roll-up describe GET /projects/{id}/progress sobre un subárbol; el 45a escribe SQL nuevo en un módulo nuevo y no altera ninguno de sus escenarios; quien sí lo modificará es el 44)"
  - "DECISIÓN PENDIENTE DE RATIFICACIÓN DEL ORQUESTADOR ANTES DE sdd-spec: D13, el menú «Planes». La propuesta lo difiere al 45c en lugar de sembrarlo en el 45a, porque _ensure_menus siembra menús globales en cada arranque y el enlace apuntaría a una ruta inexistente hasta el 45c (comodín/404 para todo usuario de toda organización). Es la ÚNICA divergencia frente al alcance dictado por el orquestador"
  - "Ronda de preguntas de propuesta NO ejecutada de forma interactiva (el ejecutor no tiene canal directo con el usuario). Las cinco preguntas de producto quedan escritas en la sección «Proposal question round» de proposal.md, cada una con el supuesto vigente si no se responde: (1) el reporte cuatrimestral es borrador de trabajo o valor oficial; (2) qué manda y si se alerta cuando el avance calculado y el reportado difieren; (3) si una tarea puede ser primary de más de una actividad; (4) si se guardan las actividades ajenas o solo las propias; (5) si PSPI y PTR se reportan con el mismo ritmo cuatrimestral del PAI. NINGUNA bloquea sdd-spec ni sdd-design"
  - "Superficie de API fijada en 10 endpoints: 5 de lectura para cualquier miembro y 5 de escritura con require_role(admin, manager). No hay POST /plans ni POST /plans/{id}/activities: la autoridad de un plan del Decreto 612 es su documento fuente y la escritura vive como costura de repositorio (D10)"
  - "Corrección aplicada durante la fase de propuesta: la migración pasó de 0028 a 0029 porque el 44 fijó DOS migraciones. SUPERADA por la corrección del orquestador durante sdd-design (2026-08-26): al eliminarse la reserva de 0026 para el cambio 40, el 45a vuelve a 0028 con down_revision='0027'. Ver design_notes y D8"
design_notes:
  - "PASADA CORRECTIVA ACOTADA (2026-08-26, segunda intervención sobre design.md y state.yaml). Origen: validación independiente con veredicto PASS_WITH_NOTES y 16 hallazgos (5 MEDIO, 11 BAJO), todos resueltos con decisiones del orquestador. H1 (MEDIO) D-F prevalece sobre D2: sin ?period= el avance reportado es null, respaldado por spec.md:86; el texto de D2 queda corregido. H2 (MEDIO) la rebanada A se parte en A1 (feat/45a-a1-migracion) y A2 (feat/45a-a2-modelos-ddl) y B pierde los modelos: SIETE rebanadas en total. H3 (MEDIO) campo derivado is_confirmed = resolution != 'conflict' en PlanActivityLinkRead, con el escenario 8 anclado a él y el roll-up declarado ajeno a plan_activity_links. H4 (MEDIO) ActivityTaskRead y list_activity_tasks en UNA consulta con JOIN Project y CTE last_column, con prueba de forma que cuenta sentencias. H5 (MEDIO) re-estimación con evidencia de disco: migración ~264 líneas, calco de prueba de migración 244 líneas; total ~2230 -> ~3020. H6 nueve índices en todo el documento. H7 precedentes de vocabulario separados por estado (search/schemas.py:15 y activity/recorder.py:23-24 vigentes; tasks/sources.py del 43 planificado). H8 discrepancia documentada entre openspec/specs/labels/spec.md:12 y labels/models.py:43 (manda el código; corregir la spec es otro cambio). H9 justificación separada de plan_activity_reports (no hay DELETE de reportes; el PUT reemplaza en la misma fila). H10 IntegrityError capturado en el servicio y traducido al mismo 409 de dominio. H11 to_activity_id validado por _require_activity -> plan_activity_not_found. H12 riesgo aceptado R14: period no se contrasta con scheduled_periods ni plan_type. H13 count_activities_by_group y PlanDetailRead con conteos por grupo, anclando el escenario 1. H14 «siete módulos sin contar __init__.py» (ocho archivos .py). H15 nota de solercia-persistence.md:42 reformulada: no exigido, el precedente tasks elige alcance por JOIN (multi-tenancy/spec.md:24). H16 borrado físico de enlaces sin deleted_by aceptado como R15, con plan_link_events como alternativa futura. CITAS CORREGIDAS: main.py:158-192 (HEAD incluye assistant_router del 48), intake/router.py:30-34, dependencies.py:189-203, docs/decisions §6 punto 5 (:108) y §7 (:116) en vez del inexistente §6.5, conftest.py:87-110. Los conteos de la spec NO cambian: 14 requisitos / 32 escenarios verificados en disco tras la pasada"
  - "DIVERGENCIA DECLARADA DE LA PASADA CORRECTIVA: la decisión H2 indicaba ~300 líneas y presupuesto 400 para A1 y para A2. La decisión H5, en la misma pasada, ordena re-estimar con la evidencia del validador, y esa evidencia (migración ~264 + prueba de migración ~244, ambas medibles en disco) supera por sí sola las ~300 de A1. Este diseño escribe la estimación que la evidencia sostiene —A1 ~515/600, A2 ~420/500— porque dejar ~300 reproduciría el mismo hallazgo H5 que la pasada debía cerrar. Si el orquestador prefiere conservar ~300/400, son dos literales por rebanada en design.md y en state.yaml y ninguna decisión de diseño cambia"
  - "CORRECCIÓN DEL ORQUESTADOR APLICADA DURANTE ESTA FASE (2026-08-26): la migración pasa de 0029/down_revision='0028' a 0028_add_institutional_plans/down_revision='0027'. Motivo: se elimina la reserva del número 0026 para el cambio 40, que no entra en esta ola; un down_revision hacia una revisión que nadie va a crear rompe alembic upgrade en DESPLIEGUE. Cadena definitiva: 43->0025; 44->0026 (boards) + 0027 (tasks); 45a->0028; el 40 toma el siguiente consecutivo libre cuando se aplique. Cambian dos literales, el docstring de la migración y los objetivos de upgrade/downgrade de la prueba (0027 -> 0028 -> 0027); NINGUNA decisión de diseño se renegocia. proposal.md y specs/ del 45a los corrige OTRO agente en paralelo: este ejecutor no los tocó"
  - "design.md escrito el 2026-08-26 en openspec/changes/45a-planes-modelo-api/design.md, con la profundidad y el formato de 43-tareas-origen-externo/design.md. Catorce decisiones técnicas propias D-A ... D-N, con letra para no colisionar con las numéricas D1-D14 ya ratificadas, que este diseño implementa sin reabrir"
  - "CONTEO EXACTO DEL MÓDULO (corregido en la pasada 2026-08-26, H14): backend/app/modules/plans/ contiene SIETE MÓDULOS SIN CONTAR __init__.py —models, vocabularies, progress, schemas, repository, service, router—, es decir OCHO archivos .py en total. Son dos más que el quinteto fijo del repositorio (models/schemas/repository/service/router): vocabularies.py (D-J) y progress.py (D-E, el punto único del criterio de exclusión). La prueba del escenario 31 se escribe con esa frase literal —«siete módulos sin contar __init__.py»— para que nadie tenga que decidir si __init__.py cuenta. Precedente de estructura VIGENTE EN DISCO: activity/recorder.py demuestra que un módulo puede tener archivos fuera del quinteto"
  - "Coste de lectura fijado por diseño: TRES consultas por listado de actividades (página + roll-up agregado por lote + reportes del periodo), independientes de N. Cierra R8 por construcción, no por disciplina"
  - "Tres divergencias declaradas frente a la letra de proposal.md, ninguna de alcance: (1) los nombres de los archivos de prueba pasan de test_plans_api.py a la terna repository/service/endpoints por convención vigente del repositorio; (2) los modelos no declaran NINGUNA relationship(), así que el import de db_init.py se justifica por poblar Base.metadata y no «para que las relationship() por cadena resuelvan»; (3) el inventario de índices sube a NUEVE al contar ix_plans_organization_id, que genera TenantMixin con index=True y que la propuesta no enumeraba"
  - "Ninguna pregunta abierta bloquea. Los cinco supuestos de la ronda de propuesta siguen vigentes y el diseño registra, para cada uno, qué cambiaría si la respuesta fuera otra. El único con efecto ANTES de la rebanada A es el supuesto 3 (si el negocio prohibiera que una tarea sea primary de más de una actividad, haría falta un único parcial (task_id) WHERE role='primary' EN LA MIGRACIÓN)"
  - "Threat Matrix: las cinco filas de la matriz estándar (rutas tipo documentación, selección de repositorio git, estado de commit, estado de push, comandos de PR) quedan marcadas N/A con razón; ninguna genera tarea. Las fronteras reales y aplicables son DIECISÉIS tras la pasada correctiva 2026-08-26 (trece originales más tres): fuga entre tenants por JOIN olvidado, fuga por el lado de la tarea, null colapsado a 0, avance inventado por periodo, N+1, autorreferencia, escritura sin RBAC, secuestro de resolution, segunda y tercera línea del PAI, autoría paralela de un plan, divergencia modelo<->migración, ancla retenida tras desenlazar, criterio de exclusión divergente, MÁS: fuga por el destino de un enlace actividad<->actividad (H11, aserción en la prueba 24), carrera en el POST de enlaces que saldría como 500 (H10, test_concurrent_duplicate_link_surfaces_409_not_500) y borrado físico de enlaces sin rastro de autor (H16, ÚNICA fila sin prueba en rojo porque es un RIESGO ACEPTADO —R15— y no hay comportamiento que probar). Quince de las dieciséis tienen prueba en rojo asignada"
