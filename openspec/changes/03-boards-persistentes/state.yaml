  - "Límite WIP por columna (kanban), validado al mover (409/422 cuando se excede)."
  - "API de configuración de columnas en runtime (renombrar/reordenar/agregar/quitar) con reglas para columnas que aún contienen tareas — esto hace usable la metodología custom."
