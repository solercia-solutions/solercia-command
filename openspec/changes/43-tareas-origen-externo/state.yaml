risks:
  - "R1 Colisión de migraciones con el 40 (doble add_column y fallo duro) — Alta — reanclaje del 40 como unidad de trabajo verificable dentro del 43"
  - "R2 CORREGIDO en design (D-B): el riesgo no es que alembic check falle, es que NO falle. Verificado sobre alembic==1.14.0: el gate no compara postgresql_where ni CheckConstraint, así que un predicado divergente o un CHECK ausente del modelo pasan en verde — Media/Alta — mitigación: test_create_all_and_migration_declare_the_same_anchor_ddl compara pg_get_indexdef y pg_get_constraintdef entre la base migrada y la construida con create_all. alembic check se conserva sólo para la existencia por nombre"
