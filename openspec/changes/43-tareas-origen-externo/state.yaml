design_notes:
  - "Diseño escrito en openspec/changes/43-tareas-origen-externo/design.md. NUEVE decisiones técnicas D-A..D-I, todas cerradas; ninguna pregunta abierta que requiera al usuario. Cobertura escenario -> prueba nombrada: 26/26 (24 pruebas automatizadas de backend, 2 de frontend cerrados con npm run build y la justificación de D-H)"
  - "PASADA CORRECTIVA 2026-08-26: verificación independiente del diseño con veredicto FAIL acotado y 14 hallazgos, todos resueltos. Los tres de fondo: (1) faltaba solercia_connect en KNOWN_TASK_SOURCES — son SIETE adaptadores, no seis — y la prueba de vocabulario pasa a ser guardia de subconjunto sobre _ADAPTERS; (2) el ancla quedaba retenida por una tarea con borrado suave, produciendo UniqueViolation -> 500 sin salida al reimportar, resuelto con AND is_active en el predicado (D-I); (3) validate_task_source nacía sin llamador, resuelto implementando D-G dentro del 43. Los once restantes eran precisión de argumento, de nombres y de cobertura"
  - "Hallazgo principal del diseño: alembic check NO es el gate del espejado que la propuesta suponía. Verificado sobre el alembic==1.14.0 instalado — no compara postgresql_where (ddl/postgresql.py:322-380) ni CheckConstraint (cero apariciones en autogenerate/compare.py). R2/R3 quedaron reescritos: el riesgo es un falso NEGATIVO, y la mitigación real es una prueba de equivalencia de DDL entre las dos rutas de construcción del esquema (alembic upgrade 0025 vs Base.metadata.create_all), comparando pg_get_indexdef y pg_get_constraintdef"
  - "El 43 introduce el PRIMER CheckConstraint del repositorio: cero apariciones previas de CheckConstraint u op.create_check_constraint en backend/. Nombre explícito obligatorio (Base sin naming_convention)"
  - "Módulo nuevo backend/app/modules/tasks/sources.py con KNOWN_TASK_SOURCES + validate_task_source: es lo que satisface el requisito de spec «Vocabulario de source» (que exige una capa de escritura que rechace 'planner'), sin acoplar tasks a app.integrations.registry"
  - "get_by_external_key devuelve la fila MÁS ANTIGUA con .order_by(created_at asc, id asc).limit(1).first(). Argumento corregido (D-E): con LIMIT 1, scalar_one_or_none() también sería seguro; la razón real de .first()/limit(1) es tolerar de forma determinista varias filas legítimas (misma ancla en proyectos distintos) sin MultipleResultsFound, y el desempate por id evita empates de created_at en la misma transacción"
  - "D-G IMPLEMENTADA en el 43 (ya no es nota de contrato): create_task(..., *, external_origin=(source, external_key)), keyword-only e invisible en el esquema HTTP; valida el vocabulario, comprueba la unicidad org-wide y persiste en el mismo INSERT; 409 task_external_anchor_conflict si el ancla ya está activa en la organización"
  - "Ramas fijadas: tracker feat/43-tareas-origen-externo; A feat/43-a-migracion (apunta al tracker); B feat/43-b-escritura (apunta a la rama de A); C feat/43-c-filtros (apunta a la rama de B)"
  - "El reanclaje del 40 quedó desglosado en 19 ediciones con ruta:línea verificadas (40/tasks.md:47,59,60,64,65,66,68-69,72; 40/design.md:26-31,75,76,116-121; 40/specs/tasks/spec.md:3-6 preámbulo, :10-22 eliminar, :24-31 conservar, :33-40 eliminar, :45 referencias; 40/state.yaml:72 last_updated y :76 spec_notes), con dos comandos rg de verificación"
