boundary:
  - "Migración 0025_add_task_external_origin (down_revision 0024): tasks.source VARCHAR(50) NULL y tasks.external_key VARCHAR(255) NULL"
  - "CHECK ck_tasks_external_key_requires_source: external_key IS NULL OR source IS NOT NULL («clave exige origen»)"
  - "Único parcial uq_tasks_source_external_key_project (source, external_key, project_id) WHERE source IS NOT NULL AND external_key IS NOT NULL AND is_active. El orden (source, external_key) como prefijo sirve además a la búsqueda org-wide, así que NO hay índice de apoyo: son DOS objetos de esquema, no tres (D-A). El AND is_active hace que una tarea con borrado suave libere su ancla (D-I)"
  - "Los DOS objetos espejados en Task.__table_args__ con el mismo postgresql_where, porque el harness construye el esquema con Base.metadata.create_all. El gate real del espejado es test_create_all_and_migration_declare_the_same_anchor_ddl, NO alembic check (D-B)"
  - "Camino de escritura del ancla: TaskService.create_task(..., *, external_origin=(source, external_key)) keyword-only, ausente de TaskCreate e invisible al router. Valida el vocabulario, comprueba la unicidad org-wide con get_by_external_key y persiste en el MISMO INSERT; si el ancla ya está activa en la organización lanza AppException code=task_external_anchor_conflict status_code=409 sin insertar (D-G)"
  - "Exposición de solo lectura: TaskRead.source y TaskRead.external_key como str | None = None; llegan gratis a TaskService._to_read y DashboardService._to_read por model_validate + from_attributes"
  - "Filtros de igualdad exacta ?source= y ?external_key= por la cadena router -> service -> repository; NO se agregan a SORTABLE_FIELDS"
  - "Costura de repositorio TaskRepository.get_by_external_key(organization_id, source, external_key) con JOIN Project, filtro de tenant, Project.is_active y Task.is_active, orden determinista (created_at asc, id asc) y limit(1): es el contrato de lectura que consumen 44 y 47"
  - "Frontend: source?: string | null y external_key?: string | null en la interfaz Task de frontend/src/entities/workspace/workspace.model.ts; TaskDetail los hereda"
  - "Reanclaje del cambio 40 como unidad de trabajo de artefactos: migración renombrada a 0026_add_external_anchor_projects_sprints, tasks fuera de su alcance, source alineado a String(50), y traslado al 43 de los requisitos «Ancla de procedencia externa» y «Clave local y externa conviven». Incluye reescribir el preámbulo 40/specs/tasks/spec.md:3-6, la referencia :45 y la nota 40/state.yaml:76, que hoy siguen diciendo que el 40 entrega el ancla"
  - "Fuera de alcance: is_context y merge_into como columnas (los declara el 44), endpoint dedicado GET /tasks/by-external-key, insignia de UI, cambios en TaskCreate/TaskUpdate, task_history, reconciliación idempotente (se queda en el 40) y retrollenado de datos"
module_decision:
  - "D1 (Q1) Unicidad org-wide en el SERVICIO, no en el motor (opción E de la exploración §3.3): garantía dura por proyecto en BD más búsqueda org-wide en el repositorio antes de insertar. Descartadas: solo por proyecto sin seam (no cubre el caso real), denormalizar organization_id (prohibido por el ADR y por D2 del 40), tabla puente task_external_anchors (desproporcionada), trigger o EXCLUDE (PostgreSQL no admite subconsultas y esconde lógica en el motor)"
  - "D2 (Q2) CHECK de «clave exige origen» (external_key IS NULL OR source IS NOT NULL), no de par estricto (source IS NULL) = (external_key IS NULL). Cierra el agujero silencioso donde (P, NULL, 'T-05') duplicado no colisiona, sin prohibir registrar procedencia sin clave estable"
  - "D3 (Q3) source como String(50) y external_key como String(255), nunca SAEnum. Precedentes: connectors.provider String(50) «deliberately NOT a PG enum», intake_items.source_provider String(50), intake_items.external_id String(255), tasks.status String(60) validado por la strategy. El VARCHAR(20) que fijaba 40/tasks.md:64 se realinea"
  - "D4 (Q4) Tarea manual deja ambas columnas NULL; no se usa centinela 'manual'. Evita retrollenado, respeta la semántica del índice parcial y no mete un valor falso en el espacio de claves"
  - "D5 (Q5) Endpoint dedicado diferido; en el 43 solo filtros ?source= y ?external_key=. Los consumidores 44 y 47 son importadores de backend que llaman al repositorio. Si alguna vez se agrega, será con query params y nunca con path: un internetMessageId de Outlook tiene forma <...@...> y admite /"
  - "D6 (Q6) Insignia de UI diferida al 44; el 43 aporta solo los dos campos opcionales del tipo. Tras el 43 no existe ni una sola tarea anclada (el 42 dejó 0 tareas), sería interfaz muerta imposible de verificar, el 44 sabe cómo etiquetarla y tocar task-modal obligaría a una pasada de UX sobre un componente que no gana información"
  - "D7 (Q7) El 43 asume los requisitos «Ancla de procedencia externa» y «Clave local y externa conviven como referencias distintas»; el 40 conserva «Reconciliación idempotente por procedencia externa» porque es comportamiento del importador. Sin esta repartición sdd-archive fusionaría el mismo requisito dos veces"
  - "D8 (Q8) El reanclaje del 40 se hace dentro del 43 como unidad de trabajo de artefactos OpenSpec: no cuenta contra el presupuesto de revisión pero debe ser tarea explícita y verificable, porque es la mitigación de R1"
  - "D9 (Q9) source y external_key NO se agregan a _HISTORY_TRACKED_FIELDS: son inmutables por API, así que el diff sería siempre vacío"
  - "D-INM Inmutabilidad por API: source y external_key fuera de TaskCreate y TaskUpdate por tres razones independientes — seguridad (un cliente podría pre-crear ('checklist_xlsx','T-05') y secuestrar la fila del importador), integridad (un PATCH que viole el único daría IntegrityError -> 500 porque update_task no lo captura) y la regla de persistencia que prohíbe controladores genéricos sobre recursos de tenant. Corregir un ancla es operación de mantenimiento en backend/app/maintenance/"
  - "D-A (design, CORREGIDA en la pasada correctiva) Forma exacta: DOS objetos, no tres — uq_tasks_source_external_key_project (source, external_key, project_id) WHERE source IS NOT NULL AND external_key IS NOT NULL AND is_active + ck_tasks_external_key_requires_source CHECK (external_key IS NULL OR source IS NOT NULL). El índice de apoyo ix_tasks_source_external_key SE ELIMINA: con el orden (source, external_key, project_id) la unicidad por proyecto es la misma y el prefijo (source, external_key) sirve además a la búsqueda org-wide de get_by_external_key, así que el segundo índice era escritura, mantenimiento, espejado y prueba de más. El CHECK es lo que vuelve sana la semántica del parcial: toda fila con clave tiene origen, luego toda fila con clave cae dentro del predicado. Es el PRIMER CheckConstraint del repositorio (cero apariciones de CheckConstraint/op.create_check_constraint en backend/); nombre explícito porque Base no declara naming_convention"
  - "D-B (design) El gate alembic check NO cubre el espejado completo. Verificado sobre alembic==1.14.0 instalado: autogenerate/compare.py no tiene comparador de CheckConstraint (cero apariciones) y ddl/postgresql.py:322-380 compare_indexes sólo compara unicidad, expresiones y _dialect_options (:313-320, sólo postgresql_nulls_not_distinct) — NO compara postgresql_where. El gate sólo detecta ausencia del índice por nombre/columnas/unicidad. El riesgo real es un falso NEGATIVO silencioso (create_all probaría una regla distinta de producción). Mitigación: test_create_all_and_migration_declare_the_same_anchor_ddl compara pg_get_indexdef y pg_get_constraintdef entre dos bases desechables (una por alembic upgrade 0025, otra por Base.metadata.create_all). NO se comparte una constante entre modelo y migración: cero migraciones importan app.* (verificado sobre las 24)"
  - "D-C (design, CORREGIDA en la pasada correctiva) Vocabulario en backend/app/modules/tasks/sources.py (módulo nuevo, precedente de estructura activity/recorder.py): KNOWN_TASK_SOURCES: Final[frozenset[str]] + validate_task_source(value) -> str que lanza AppException 422 code=invalid_task_source sin hacer eco del valor. Contenido: OCHO valores — checklist_xlsx más los SIETE provider registrados microsoft365, google, jira, glpi, mcp, fake y solercia_connect. solercia_connect faltaba en la versión anterior: declara PROVIDER='solercia_connect' (adapters/solercia_connect/adapter.py:53), se registra en adapters/solercia_connect/__init__.py:14 y app/db_init.py:36 lo importa; como intake/service.py:295 escribe source_provider=connector.provider sin filtrar, su omisión era un 422 latente. planner NO está, con comentario. Descartado leer app.integrations.registry._ADAPTERS (se puebla en tiempo de importación, crearía dependencia tasks -> integrations, y checklist_xlsx no es conector) y descartada constante dentro de service.py (~970 líneas para leer un frozenset desde 44/47). La deriva se cubre con una GUARDIA de prueba: tras import app.db_init, {a.provider for a in _ADAPTERS.values()} <= KNOWN_TASK_SOURCES (subconjunto, no igualdad). La prueba importa integrations; el módulo tasks sigue sin importarlo"
  - "D-D (design, matizada) SIN envoltorio de LECTURA en el servicio: no se agrega TaskService.find_by_external_key porque nacería sin llamador (create_task consume el repositorio directamente) y ningún requisito de spec lo pide. El repositorio ES el puerto de lectura del agregado (regla de persistencia: métodos semánticos por agregado con tenant obligatorio). La ESCRITURA sí tiene caso de uso en el servicio: es D-G. Precedente de consumo cruzado: TaskService instancia SprintRepository(self.repo.db) en service.py:931. Desviación preexistente respetada: TaskRepository.create/save SÍ comitean (repository.py:229-242) contra la regla; el 43 no la corrige ni la empeora — el ancla viaja en el mismo INSERT, sin estado intermedio observable"
  - "D-E (design, ARGUMENTO CORREGIDO) get_by_external_key usa .order_by(Task.created_at.asc(), Task.id.asc()).limit(1) + .scalars().first(). Corrección: con LIMIT 1, scalar_one_or_none() TAMBIÉN sería seguro — no puede lanzar MultipleResultsFound sobre una sola fila. La razón real de .first()/limit(1) es tolerar de forma determinista varias filas legítimas (misma ancla en proyectos distintos de la misma organización, que la spec exige que funcione) sin depender de que un lector futuro entienda que el LIMIT es lo que vuelve seguro al scalar_one_or_none. El desempate por id evita empates de created_at al milisegundo dentro de una misma transacción: dos llamadas consecutivas devuelven siempre la misma fila y una reimportación reconcilia contra el registro original"
  - "D-F (design) Los campos extra se IGNORAN, no se rechazan: verificado que TaskCreate (schemas.py:13-59), TaskUpdate (:62-92) y TaskRead (:95-153) no declaran extra='forbid'; TaskRead sólo declara ConfigDict(from_attributes=True) (:98). No se agrega extra='forbid' porque cambiaría el contrato para TODO campo desconocido del endpoint, no sólo para estos dos. La protección es estructural: model_dump(exclude_unset=True) en service.py:422 nunca ve un campo que el esquema no declara"
  - "D-G (design, IMPLEMENTADA en la pasada correctiva; antes diferida) Camino de escritura del ancla DENTRO del 43: TaskService.create_task(self, organization_id, project_id, data: TaskCreate, *, actor_id=None, external_origin: tuple[str, str] | None = None). Keyword-only, ausente de TaskCreate y no pasado por el router: inalcanzable por HTTP, D-INM intacto. Cuando viene informado: valida con validate_task_source (422 invalid_task_source), comprueba unicidad org-wide con self.repo.get_by_external_key y, si ya hay una tarea activa con ese ancla en la organización, lanza AppException code=task_external_anchor_conflict status_code=409 SIN insertar; si no, asigna source/external_key al objeto Task ANTES de repo.create, de modo que el ancla entra en el mismo INSERT. Se implementa y no se difiere porque (1) validate_task_source nacía sin un solo llamador y el requisito de spec «Vocabulario de source» no quedaba satisfecho por nada, (2) las pruebas de exposición y de la costura tendrían que anclar con UPDATE crudo, probando contra un camino que la aplicación no usa, y (3) cierra R9 en vez de mitigarlo. Código en lower_snake_case como los 25 códigos vigentes de tasks/service.py, no en MAYÚSCULAS. Alternativas rechazadas: UPDATE posterior (ventana de duplicación), ancla en TaskCreate (rompe D-INM), create_imported_task aparte (duplicaría ~80 líneas de validación de metodología/jerarquía/estimación)"
  - "D-I (design, NUEVA en la pasada correctiva) Una tarea con borrado suave LIBERA su ancla: el predicado del único parcial incluye AND is_active. Secuencia de fallo que lo motivó: importar ('jira','PROJ-1') -> borrado suave -> reimportar -> get_by_external_key devuelve None (excluye is_active=false) pero el INSERT choca con el índice -> UniqueViolation -> 500 sin salida, porque el proyecto prohíbe el delete físico. La costura y el índice discrepaban sobre qué significa «ocupado»; con AND is_active cubren el mismo conjunto de filas. Alternativas rechazadas: incluir borradas en la costura (rompe la convención de todo el repositorio y resucitaría tareas borradas a propósito), capturar UniqueViolation en el importador (convierte un caso normal en error a traducir) y usar deleted_at en vez de is_active (columna que ninguna lectura consulta). SALVEDAD: hoy NO existe ruta de restauración de tareas (verificado: tasks/service.py:645 sólo pone is_active=False; las reactivaciones de task_links/connectors/glpi_sync son de otros agregados). Si alguna vez se agrega, DEBE comprobar el ancla con get_by_external_key antes de reactivar; registrado como R10"
  - "D-H (design) Frontend sin prueba de tipos, verificado con npm run build. Razones concretas: frontend/package.json:5-11 no define script de pruebas ni runner; tsconfig.app.json:7-10 declara files=['src/main.ts'] e include=['src/**/*.d.ts'], así que un archivo suelto de aserciones de tipo NUNCA se compilaría (falsa cobertura); y agregar dos propiedades opcionales es aditivo puro que no puede romper la compilación. La existencia del contrato la prueba el backend (escenarios 11 y 12)"
facts_verified:
  - "Task.__table_args__ (tasks/models.py:43-58) tiene HOY solo dos índices GIN trigram (ix_tasks_title_trgm, ix_tasks_description_trgm) y CERO restricciones únicas"
  - "tasks NO tiene organization_id: el tenant es transitivo por project_id vía JOIN a Project, documentado en el docstring del módulo (tasks/models.py:1-8) y del repositorio (repository.py:1-5)"
  - "TaskCreate (schemas.py:13-59) y TaskUpdate (schemas.py:62-92) no incluyen source ni external_key; TaskUpdate tampoco acepta project_id y el servicio nunca lo reasigna, así que hoy una tarea NO puede moverse entre proyectos por la API (verificado sobre las 29 apariciones de project_id en service.py)"
  - "TaskService._to_read (service.py:954-969) y DashboardService._to_read (dashboard/service.py:469-473) usan TaskRead.model_validate(task) sin mapeo manual, con ConfigDict(from_attributes=True): agregar campos al esquema los expone en todos los consumidores con cero cambios de servicio"
  - "No existe clase TaskFilters: los filtros son Query sueltos en router.py:44-121, reenviados por service.py:67-156 y aplicados en repository.py:42-125. SORTABLE_FIELDS (repository.py:26-33) contiene order, title, status, priority, due_date, created_at"
  - "No existe búsqueda por clave externa en el repositorio: las lecturas puntuales son get, get_by_ids, get_by_project_and_number y list_for_org"
  - "Precedente de ancla de procedencia: IntakeItem (intake/models.py:39-71) con source_provider String(50) indexado, external_id String(255) indexado y UNIQUE(organization_id, connector_id, external_id)"
  - "Al convertir un intake_item en tarea (intake/service.py:560-580) NO se ancla nada: solo item.created_task_id = task.id y la línea de texto f\"Origen: {item.source_provider} — {item.origin_actor}\" (:177-185). La trazabilidad actual es texto libre más FK inversa"
  - "Cabeza real de Alembic en disco: 0024 (0024_add_work_calendar.py:38-39, down_revision=\"0023\"). Siguiente número libre: 0025. 24 archivos con convención 00NN_verbo_sustantivo.py"
  - "Patrón aditivo canónico: 0022_add_project_kind.py (docstring que cita el cambio, op.add_column, server_default solo si NOT NULL y luego alter_column(server_default=None)). NO hay batch_alter_table en ninguna migración: PostgreSQL exclusivo"
  - "Índices únicos parciales ya establecidos y aprobados por el gate: 0017:58-63 (uq_users_numero_documento con postgresql_where), 0018:89-101 (dos parciales complementarios) y 0023:416-421"
  - "Regla dura verificada: el índice parcial debe declararse TAMBIÉN en el modelo ORM (nota explícita en users/models.py:30-38 y org_role_templates/models.py:36-51) porque tests/conftest.py:43-84 construye el esquema con Base.metadata.create_all, no con Alembic"
  - "Gate automático: tests/test_migrations_baseline.py:192-214 (test_alembic_check_reports_no_diff_after_upgrade) ejecuta alembic check y falla ante cualquier diff modelo↔migración"
  - "Patrón literal de prueba de migración aislada: test_migration_project_kind.py:73-244 (base desechable, upgrade a head-1, siembra por SQL crudo con asyncpg, upgrade, aserciones sobre information_schema, downgrade y aserción de no pérdida de filas)"
  - "Vocabulario de proveedores: Connector.provider es String(50) indexado con comentario normativo «deliberately NOT a PG enum» (connectors/models.py:50-53). Adaptadores REGISTRADOS: SIETE, no seis — microsoft365 (microsoft365/adapter.py:35), google (google/adapter.py:33), jira (jira/adapter.py:208), glpi (glpi/adapter.py:305), mcp (mcp/adapter.py:20), fake (fake.py:115) y solercia_connect (solercia_connect/adapter.py:53 PROVIDER, :253 provider=PROVIDER, registrado en solercia_connect/__init__.py:14). app/db_init.py:30-36 importa los siete. intake/service.py:295 escribe source_provider=connector.provider sin filtrar por proveedor. shared/enums.py NO tiene enum de proveedor. Planner no es proveedor: se lee vía microsoft365 más Capability.external_tasks"
  - "NO existe ruta de restauración de tareas: rg sobre backend/app/ devuelve sólo task.is_active = False (tasks/service.py:645). Las reactivaciones existentes (is_active = True) son de otros agregados: task_links/service.py:117, connectors/repository.py:136, glpi_sync/repository.py:74. Por eso D-I (el borrado suave libera el ancla) es seguro hoy y su salvedad es futura"
  - "Convención de códigos de error verificada: los 25 códigos de tasks/service.py son lower_snake_case (task_not_found, invalid_task_type, sprint_closed, invalid_estimation...), igual que el valor por defecto app_error de AppException (shared/exceptions.py:20). El ejemplo TASK_NOT_FOUND en mayúsculas de CLAUDE.md NO refleja el código real; manda el código"
  - "TaskService.create_task (service.py:252-335) tiene hoy la firma (self, organization_id, project_id, data: TaskCreate, *, actor_id=None) -- el parámetro se llama `data`, no `payload`. Ya existe el bloque keyword-only donde entra external_origin"
  - "is_context NO es columna: es campo transitorio de TaskRead (schemas.py:153) calculado en _to_read. El cambio 44 lo necesita como columna real, junto con merge_into"
  - "Punto de extensión del frontend: interfaz Task en frontend/src/entities/workspace/workspace.model.ts:9-38, casi todo opcional (task_key?, is_context?); TaskDetail extends Task en entities/task/task-detail.model.ts:4-9; no existe entities/task/task.model.ts"
  - "Estilo de prueba de API: test_task_filters.py:1-64 con helpers _auth, _create_project, _create_task y _list_tasks (el bloque de andamiaje termina en :64; la cita previa :1-59 dejaba fuera _list_tasks), API real vía httpx in-process, @skip_no_db y @pytest.mark.asyncio(loop_scope=\"session\"); fixtures engine (create_all + CREATE EXTENSION pg_trgm), session (SAVEPOINT), client, tenant, user"
  - "Línea base de pruebas: 1411 pasadas / 3 fallidas preexistentes en tests/test_adapter_microsoft365.py (dependientes del reloj), con TEST_DATABASE_URL configurada. Sin esa variable skip_no_db salta 898 pruebas y la corrida no sirve de referencia"
  - "El cambio 42 excluye explícitamente tasks.source/external_key y declara que bloquea al 43 (42/state.yaml:55). Tras el 42 la base queda con 1 organización, 1 usuario, SDMUJER > SEGURIDAD + PANDORA y 0 tareas"
  - "Brecha detectada en el 40: su texto de spec (40/specs/tasks/spec.md:10-22) promete unicidad org-wide mientras su decisión D2 (40/design.md:26-31) implementa unicidad por proyecto. El 43 debe explicitar qué garantiza el motor y qué el servicio"
  - "CORRECCIÓN de R2/R3 (fase design, verificado sobre alembic==1.14.0 instalado): alembic check NO compara postgresql_where de índices (ddl/postgresql.py:322-380 compare_indexes -> unicidad + expresiones + _dialect_options, y _dialect_options :313-320 sólo mira postgresql_nulls_not_distinct) NI CheckConstraint (cero apariciones en autogenerate/compare.py). Sólo detecta ausencia del índice por nombre/columnas/unicidad. El riesgo real no es un falso positivo del gate sino un falso NEGATIVO silencioso"
  - "alembic/env.py configura compare_type=True y target_metadata=Base.metadata, sin include_object ni compare_server_default. Cero migraciones de las 24 importan app.* (verificado con rg '^from app|^import app' sobre alembic/versions)"
