  - "Precedente de RED rápido de API dentro de un archivo de prueba de migración: test_migration_project_kind.py:48-65 (T1.1) convive con las dos pruebas de migración síncronas (:156-244) en el mismo archivo"
  - "Precedente de consumo cruzado de repositorio desde un servicio de otro módulo: TaskService._require_sprint instancia SprintRepository(self.repo.db) en tasks/service.py:931"
  - "Desviación preexistente de la regla de persistencia: TaskRepository.create y save SÍ hacen commit (repository.py:229-242), contra «los repositorios nunca hacen commit». El 43 no la corrige ni la propaga"
