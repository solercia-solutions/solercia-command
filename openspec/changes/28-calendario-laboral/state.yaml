boundary:
  - "Equipo = proyecto raiz (project_kind del cambio 27); el override de calendario vive SOLO en la raiz, los hijos heredan"
  - "Persistir como columnas (organizations + projects nullable), NO tabla work_calendar dedicada (se reserva para festivos/husos futuros)"
  - "working_days = array de enteros ISO 8601 (Lun=1..Dom=7); default global 8h/L-V"
  - "Fuera de alcance: festivos/excepciones, husos horarios, jornadas partidas, calendarios por persona, y el calculo de conversion (34) y avance esperado (35)"
  - "Prerrequisito de 34-estimacion-normalizada y 35-avance-esperado-vs-real"
migration:
  - "Head real en disco = 0020_add_theme_to_organizations (revision 0020); no existen migraciones 25/26/27 en disco todavia"
  - "Este cambio encadena tras la secuencia 25 -> 26 -> 27 (esperado 0024); revision exacta a fijar en design/apply contra el head real"
  - "1 migracion aditiva: columnas working_hours_per_day + working_days en organizations y en projects (nullable)"
facts_verified:
  - "Organization solo tiene name/slug/theme; NO existe working_hours/working_days (app/modules/organizations/models.py)"
  - "Project tiene parent_project_id (self-FK indexado) y lead_user_id; NO existe working_hours/working_days (app/modules/projects/models.py)"
  - "No hay ninguna referencia a working_hours/working_days/work_calendar/project_kind en backend hoy (project_kind lo introduce el cambio 27)"
  - "Consecutivo 28 libre en openspec/changes/"
last_updated: 2026-07-20
spec_notes:
  - "Capabilities: work-calendar (spec nueva, full) + projects (delta ADDED)"
  - "Endpoints (reconciliados en tasks.md a PUT, verbo definitivo de spec.md/design.md): GET/PUT /organizations/me/work-calendar (admin); GET/PUT /projects/{id}/work-calendar (admin/manager, solo raiz); GET /projects/{id}/work-calendar/resolved (source: team|organization|default)"
