services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: solercia
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/initdb:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d solercia"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/solercia
      TEST_DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/solercia_test
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-change-me
      INTEGRATIONS_FERNET_KEY: GVraOHsbm9EGeG8TDBNGc8TRZZEzPeSVIkytJ7jZGd8=
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "4242:4200"
    depends_on:
      - backend

volumes:
  pgdata:
