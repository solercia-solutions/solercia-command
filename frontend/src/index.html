<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Solercia Command</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Solercia Command — centro operativo de trabajo multiempresa."
    />
    <link rel="icon" type="image/svg+xml" href="assets/logos/solercia-command-favicon.svg" />
    <!-- Fonts: the base pair loads from styles.scss and the theme's `meta.fonts`
         from ThemeService; here only the connection is warmed up. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Apply the persisted/system theme before Angular boots to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem('sol-dark-mode');
          var dark =
            stored !== null
              ? stored === 'true'
              : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* no-op */
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
